{id:173,s:"PORTFOLIO",q:"Optimal risky portfolio: E(R)=15%, sigma=20%, Rf=5%. A risk-seeking investor would most likely:",o:["Lend 100% at risk-free rate","Invest 100% in optimal risky portfolio","Borrow 25% at risk-free rate and invest 125% in optimal risky portfolio","Split equally between risk-free and risky portfolio"],c:2,e:"Risk-seeking investors invest more than 100% in the risky portfolio by borrowing at the risk-free rate — point to the right on the CAL."},
{id:174,s:"DERIVATIVES",q:"Which European option has greatest value at expiration? Put X=83 S=72; Put X=72 S=83; Call X=83 S=70:",o:["Put with X=72 and S=83","Put with X=83 and S=72","Call with X=83 and S=70","All have zero value"],c:1,e:"Put payoff = max(0, X-S). Put(X=83, S=72) = max(0, 83-72) = 11. Put(X=72, S=83) = 0. Call(X=83, S=70) = 0."},
{id:175,s:"EQUITY",q:"D1=$2, growth=4%, ROE=9%. If required return increases from 8% to 14%, stock value decreases by:",o:["50%","60%","75%","40%"],c:1,e:"r=8%: V0=2/(0.08-0.04)=$50. r=14%: V0=2/(0.14-0.04)=$20. Decrease = (50-20)/50 = 60%."},
{id:176,s:"FIXED_INCOME",q:"In bankruptcy, which has highest priority claim?",o:["Secured debt","Unsecured debt","Subordinated debt","Preferred equity"],c:0,e:"Secured debt (backed by assets) has highest priority claim over all unsecured creditors, subordinated debtholders, and equity holders."},
{id:177,s:"FIXED_INCOME",q:"In a securitization, the seller of the pool of securitized assets is the:",o:["Trustee","Depositor","Special purpose entity","Servicer"],c:1,e:"The depositor (also called originator) is the seller of the collateral pool in a securitization. The SPV is the issuer."},
{id:178,s:"DERIVATIVES",q:"Which positions gain if the price of the underlying decreases?",o:["Short forward only","Short call option only","Both short forward and short call option","Long put only"],c:2,e:"Short forward, short call, and long put all gain from a decrease in the underlying price. Short forward and short call both benefit here."},
{id:179,s:"CORPORATE",q:"A company's share price is most likely to decrease by the dividend amount on the:",o:["Declaration date","Ex-dividend date","Holder-of-record date","Payment date"],c:1,e:"On the ex-dividend date, buyers are no longer eligible to receive the upcoming dividend, so all else equal the share price decreases by the dividend amount."},
{id:180,s:"FIXED_INCOME",q:"Bond: annual modified duration=2.741, annual convexity=22.638, yield decreases by 0.8%. Expected % price change is closest to:",o:["-2.12%","2.27%","2.34%","1.85%"],c:1,e:"% delta-P = (-2.741 x -0.008) + (0.5 x 22.638 x 0.008^2) = 0.02193 + 0.00072 = 2.27%."},
{id:181,s:"PORTFOLIO",q:"Which statement about distributed ledger technology (DLT) is most accurate?",o:["DLT is energy-efficient requiring minimal energy","Incorrect entries can easily be deleted from the ledger","A DLT consensus mechanism requires nodes to agree on a common state of the ledger","DLT requires centralized verification"],c:2,e:"Consensus mechanism: the process by which computer entities (nodes) in a network agree on a common state of the ledger."},
{id:182,s:"PORTFOLIO",q:"In enterprise risk management, identifying shortfalls that would cause failure to achieve critical goals occurs when:",o:["Monitoring and mitigating risk","Making the risk tolerance decision","Allocating capital to risky activities","Measuring risk exposures"],c:1,e:"The risk tolerance decision begins with identifying shortfalls within the organization that would cause it to fail or fail to achieve critical goals."},
{id:183,s:"FIXED_INCOME",q:"Mortgage most likely classified as prime: Loan 1 (Low LTV, First Lien), Loan 2 (Low LTV, Second Lien), Loan 3 (High LTV, First Lien):",o:["Loan 1","Loan 2","Loan 3","None qualify as prime"],c:0,e:"Prime loans: high credit quality, low LTV (more equity in property), and first lien position. Loan 1 meets all prime criteria."},
{id:184,s:"ALT_INV",q:"Compared to public equity, private equity allows management to better:",o:["Access capital markets","Adopt a long-term focus","Improve corporate governance","Enhance reporting transparency"],c:1,e:"Private companies are not subject to quarterly earnings pressure from analysts; owners are better positioned to focus on longer-term value creation."},
{id:185,s:"PORTFOLIO",q:"If correlation between assets in a two-asset portfolio is less than one, portfolio standard deviation is:",o:["Equal to weighted average sigma of individual assets","Less than weighted average sigma of individual assets","Greater than weighted average sigma","Unaffected by correlation"],c:1,e:"When rho < 1, portfolio risk falls below the weighted average of individual standard deviations — the diversification benefit."},
{id:186,s:"PORTFOLIO",q:"In an efficient market, asset prices most likely react to:",o:["Expected information only","Unexpected information only","Both expected and unexpected information","Neither — prices are random"],c:1,e:"In efficient markets, expected information is already priced in. Only the unexpected or surprise element of information releases moves prices."},
{id:187,s:"ALT_INV",q:"Hedge fund: $80M AUM, management fee 2% (end-of-year AUM), incentive 20%, soft hurdle 5%, gross return 12.5%. Total fees are:",o:["$3,000,000","$3,440,000","$3,800,000","$2,800,000"],c:2,e:"End-of-year AUM = $90M. Mgmt fee = 90M x 2% = $1.8M. Incentive (soft hurdle: entire return) = 80M x 12.5% x 20% = $2M. Total = $3.8M."},
{id:188,s:"ALT_INV",q:"Capital for companies moving toward operation but before commercial manufacturing and sales best describes which VC stage?",o:["Later stage","Seed stage","Early stage","Mezzanine stage"],c:2,e:"Early-stage (start-up stage) financing goes to companies moving toward operation but prior to commercial production or sales."},
{id:189,s:"EQUITY",q:"Price multiples for relative comparisons are most likely used for:",o:["Time-series analyses only","Cross-sectional analyses only","Both time-series and cross-sectional analyses","Absolute valuation only"],c:2,e:"Price multiples allow for relative comparisons both cross-sectional (vs. market or comparable company) and in time series (vs. own history)."},
{id:190,s:"ALT_INV",q:"Under US GAAP, an investment valued using reliable outside broker quotes is most appropriately categorized as:",o:["Level 1 asset","Level 2 asset","Level 3 asset","Level 4 asset"],c:1,e:"Level 1: exchange-traded public price available. Level 2: outside broker quotes used. Level 3: internal models only (observable inputs unavailable)."},
{id:191,s:"PORTFOLIO",q:"Which measure is zero for the risk-free asset?",o:["M-squared","Sharpe ratio","Jensen&#39;s alpha","Treynor ratio"],c:2,e:"Jensen&#39;s alpha = Rp - [Rf + beta(Rm-Rf)]. For risk-free asset: Rp=Rf and beta=0, so alpha = Rf - Rf = 0. Sharpe and Treynor require nonzero risk in denominator."},
{id:192,s:"DERIVATIVES",q:"A buyer's profit from an in-the-money put option is best described as:",o:["Value of the option at expiration minus the option premium","Spot price minus exercise price","Strike price minus value of underlying at expiration","Option premium received"],c:0,e:"Put buyer's profit = max(0, X-ST) - p0 = intrinsic value at expiration minus the premium paid."},
{id:193,s:"FIXED_INCOME",q:"Yield measures for both bonds and money market instruments are most likely:",o:["Compounded","Stated in annual terms","Based on simple interest","Stated on a semiannual basis"],c:1,e:"Both bond YTMs and money market yields are stated in annual terms; bonds are compounded, money market instruments use simple interest."},
{id:194,s:"EQUITY",q:"Which pooled investment product is most likely to trade furthest from its NAV?",o:["ETF","Open-end mutual fund","Closed-end mutual fund","Index fund"],c:2,e:"Closed-end funds have fixed shares outstanding and can trade at significant premium or discount to NAV based on supply and demand for shares."},
{id:195,s:"DERIVATIVES",q:"If futures prices are positively correlated with interest rates, futures prices are likely to be:",o:["Lower than forward prices","Equal to forward prices","Higher than forward prices","Unrelated to forward prices"],c:2,e:"Positive correlation with rates: futures are more desirable to long positions (earn more on marking-to-market); futures price exceeds forward price."},
{id:196,s:"PORTFOLIO",q:"Portfolio sigma=10%, beta=0.5, market sigma=20%. Covariance between portfolio and market is closest to:",o:["0.005","0.010","0.020","0.050"],c:2,e:"Beta = Cov(Rp,Rm)/sigma_m^2. Therefore Cov = beta x sigma_m^2 = 0.5 x (0.20)^2 = 0.5 x 0.04 = 0.020."},
{id:197,s:"EQUITY",q:"Which valuation model does NOT require estimating required rate of return?",o:["A price multiple model","The Gordon growth model","A free-cash-flow-to-equity model","A residual income model"],c:0,e:"Price multiple models use ratios (P/E, P/B, EV/EBITDA) to compare relative worth without needing to estimate a discount rate explicitly."},
{id:198,s:"ALT_INV",q:"Debtor-in-possession (DIP) financing refers to financing for firms:",o:["Already in bankruptcy","At risk of bankruptcy without additional financing","With strong financial positions","Emerging from bankruptcy"],c:0,e:"Distressed debt funds specialize in DIP financing, which provides operating funds for firms already in formal bankruptcy proceedings."},
{id:199,s:"FIXED_INCOME",q:"5-year 8% annual coupon bond priced at 96.11 per 100 par. YTM is closest to:",o:["7.33%","8.32%","9.00%","8.00%"],c:2,e:"N=5, PV=-96.11, PMT=8, FV=100. Solving: I/Y = 9.00%."},
{id:200,s:"FIXED_INCOME",q:"Bond 1 (callable), Bond 2 (putable), Bond 3 (no options), otherwise identical. Manager says both 1 and 2 should have larger yield spreads than 3. Is he correct?",o:["Yes, both have larger spreads than Bond 3","No, Bond 1 spread should be less than Bond 3","No, Bond 2 spread should be less than Bond 3","No, both should have smaller spreads"],c:2,e:"Callable bond: issuer holds option — investors demand higher spread. Putable bond: investor holds option — investors accept lower spread than straight bond."},
{id:201,s:"EQUITY",q:"Investor posts 55% equity, purchases stock at 95 euros per share, maintenance margin=30%. Margin call price is closest to:",o:["42.75 euros","61.07 euros","74.64 euros","55.00 euros"],c:1,e:"Margin call price = P0 x (1 - initial margin)/(1 - maintenance margin) = 95 x 0.45/0.70 = 61.07 euros."},
{id:202,s:"FIXED_INCOME",q:"Portfolio of 4 bonds with durations 3.2, 7.6, 12.4, 1.5 and values $1.2M, $3.4M, $2.9M, $1.6M. Portfolio duration is closest to:",o:["5.4","6.2","7.5","8.1"],c:2,e:"Total value=$9.1M. Duration = (1.2/9.1 x 3.2) + (3.4/9.1 x 7.6) + (2.9/9.1 x 12.4) + (1.6/9.1 x 1.5) approximately 7.5."},
{id:203,s:"ALT_INV",q:"Which is best categorized as a hard commodity?",o:["Cattle","Lumber","Crude oil","Wheat"],c:2,e:"Hard commodities are mined or extracted (crude oil, copper, gold). Soft commodities are grown over a period of time (livestock, grains, coffee)."},
{id:204,s:"PORTFOLIO",q:"Investor: Rf=4%, E(Rm)=12%, sigma_m=20%. Expected return of portfolio on CML with sigma_p=15% is closest to:",o:["6%","8%","10%","12%"],c:2,e:"E(Rp) = Rf + [(E(Rm)-Rf)/sigma_m] x sigma_p = 4% + (8%/20%) x 15% = 4% + 6% = 10%."},
{id:205,s:"DERIVATIVES",q:"The value of a European call is inversely related to which factor?",o:["Exercise price","Time to expiration","Value of the underlying","Risk-free interest rate"],c:0,e:"Higher exercise price reduces call option value (holder pays more to exercise). Call value is inversely related to exercise (strike) price."},
{id:206,s:"EQUITY",q:"Which is most likely forecast using historical depreciation and amortization expenses?",o:["Growth capital expenditures","Future debt and equity levels","Maintenance capital expenditures","Working capital requirements"],c:2,e:"Maintenance capex forecasts are often based on historical D&A expenses, usually adjusted upward to account for capital goods inflation."},
{id:207,s:"DERIVATIVES",q:"Investor sells a European put: put price=15, exercise price=250. If underlying price at expiration=260, seller's profit is:",o:["5","10","15","0"],c:2,e:"Put seller's profit = -max(0, X-ST) + p0 = -max(0, 250-260) + 15 = 0 + 15 = 15."},
{id:208,s:"ALT_INV",q:"Compared to deal-by-deal waterfall, the whole-of-fund waterfall method is:",o:["More advantageous to GPs than LPs","Equally advantageous to GPs and LPs","Less advantageous to GPs than LPs","More advantageous to GPs in early years"],c:2,e:"Whole-of-fund: all distributions go to LPs first; GP does not participate in profits until LPs recover investment plus hurdle rate."},
{id:209,s:"FIXED_INCOME",q:"A bond issuer is most likely less creditworthy than peers if it has:",o:["Lower debt/EBITDA and lower EBITDA/interest expense","Lower debt/EBITDA and higher EBITDA/interest expense","Higher debt/EBITDA and lower EBITDA/interest expense","Similar leverage with higher revenue growth"],c:2,e:"Higher debt/EBITDA (more leverage) AND lower EBITDA/interest (weaker coverage) both indicate higher probability of default."},
{id:210,s:"EQUITY",q:"An analyst tests market efficiency by computing serial correlations in security returns. The analyst is assessing whether markets are:",o:["Weak-form efficient","Semi-strong-form efficient","Strong-form efficient","Adaptive market efficient"],c:0,e:"Weak-form efficiency tests use past price patterns. Serial correlation in returns would imply predictable price patterns, violating weak-form efficiency."},
{id:211,s:"FIXED_INCOME",q:"In a repurchase agreement, the initial margin:",o:["Eliminates credit risk entirely","Offers partial protection against changes in collateral market value","Only applies when collateral is government bonds","Is the fee paid to the lender of funds"],c:1,e:"Initial margin (collateral in excess of cash exchanged) provides partial protection against collateral value shortfalls over the contract's life."},
{id:212,s:"FIXED_INCOME",q:"The yields of a series of zero-coupon government bonds for a full range of maturities best define a:",o:["Par curve","Spot curve","Forward curve","OAS curve"],c:1,e:"Government bond spot (zero) curve = yields-to-maturity on zero-coupon government bonds across all maturities."},
{id:213,s:"PORTFOLIO",q:"An overreaction where investors sell because other investors are selling best describes:",o:["Herding","Loss aversion","Overconfidence","Anchoring"],c:0,e:"Herding: investors trade on the same side of the market, ignoring their own analysis and following the crowd — can cause overreactions."},
{id:214,s:"DERIVATIVES",q:"Relative to spot markets, a key feature of derivatives markets is:",o:["High transaction costs","Low capital requirements","Restrictions on short selling","Physical delivery requirements"],c:1,e:"Derivatives markets provide low capital requirements (margin vs full price of asset), enabling efficient hedging and speculation."},
{id:215,s:"EQUITY",q:"With respect to margin, the leverage ratio:",o:["Is equity divided by position value","Is minimum fraction of purchase price that must be equity","Indicates how many times larger a position is than supporting equity","Is the initial margin requirement"],c:2,e:"Leverage ratio = Value of position / Value of equity investment. Indicates how many times larger the position is relative to the equity supporting it."},
{id:216,s:"ALT_INV",q:"Hedge fund: $98M initial, 2% mgmt fee, 20% incentive, high-water mark. Year 1 ends at $112M, Year 2 at $100M, Year 3 at $116M. Net-of-fees return Year 3 is closest to:",o:["11.87%","12.33%","14.15%","16.0%"],c:2,e:"HWM=$106.96M (end Yr1 net fees). Yr2 net=$98M. Yr3: Mgmt=2.32M, Incentive=(116-106.96) x 20%=1.81M. Net=(116-4.13-98)/98=14.15%."},
{id:217,s:"FIXED_INCOME",q:"A callable bond most likely experiences negative convexity when its yield to maturity is:",o:["Less than the bond's coupon rate","Equal to the bond's coupon rate","Greater than the bond's coupon rate","At any yield level equally"],c:0,e:"When YTM < coupon rate, the call option has high value (issuer likely to call and refinance); bond exhibits negative convexity."},
{id:218,s:"PORTFOLIO",q:"In the portfolio management process, the feedback step most likely involves:",o:["Rebalancing the portfolio","Deciding on an asset allocation","Understanding the client's constraints","Developing the IPS"],c:0,e:"The feedback step assists the portfolio manager in rebalancing the portfolio due to changes in market conditions or client circumstances."},
{id:219,s:"PORTFOLIO",q:"Which ESG approach specifically selects investments based on environmental or social benefits?",o:["Impact investing","Negative screening","Engage/active ownership","ESG integration"],c:0,e:"Impact investing specifically selects investment opportunities based on intention to create positive environmental and social impact alongside financial returns."},
{id:220,s:"FIXED_INCOME",q:"$20M par bond, full value=$23.275M, annual modified duration=6.39. If yield increases 50 bps, change in value is closest to:",o:["-$743,636","$743,636","-$639,000","$639,000"],c:0,e:"MoneyDur = 6.39 x 23,275,000 = 148,727,250. DeltaPV = -148,727,250 x 0.005 = -$743,636."},
{id:221,s:"FIXED_INCOME",q:"Which ABS most likely uses credit tranching as credit enhancement?",o:["Covered bond","Credit card backed security","Agency mortgage pass-through security","Auto loan ABS with government guarantee"],c:1,e:"Credit card ABS typically combines subordination (credit tranching) and other credit enhancements to support the various tranches."},
{id:222,s:"FIXED_INCOME",q:"Which is most likely a limitation of the yield-to-maturity measure?",o:["It does not reflect timing of cash flows","It assumes coupons can be reinvested at the YTM","It does not consider capital gain or loss","It requires complex calculation"],c:1,e:"YTM limitation: assumes coupon reinvestment at the YTM rate. In practice, reinvestment rates differ, creating reinvestment risk."},
{id:223,s:"DERIVATIVES",q:"Put-call parity best demonstrates the equivalence of:",o:["Puts and calls","A covered call and a protective put","A fiduciary call and a protective put","A married put and a covered call"],c:2,e:"Put-call parity: c0 + X/(1+r)^T = p0 + S0 shows that a protective put and a fiduciary call produce identical payoffs."},
{id:224,s:"EQUITY",q:"Which is NOT a source of return from investing in equities?",o:["Cash dividends","Stock dividends","Change in market price of equities","Dividend reinvestment income"],c:1,e:"Stock dividends have no economic effect — shareholders receive more shares at proportionally lower price. Not a source of wealth return."},
{id:225,s:"EQUITY",q:"Instructions that tell brokers how to settle trades are best described as:",o:["Validity instructions","Clearing instructions","Execution instructions","Limit instructions"],c:1,e:"Clearing instructions tell brokers and exchanges how to arrange final settlement of trades — separate from execution instructions (how to fill the order)."},
];
// ── ETHICS QUESTIONS FROM MOCK EXAMS ─────────────────────────
var ETH=[
{id:226,s:"ETHICS",q:"Smith changes his Green Company recommendation from buy to sell and mails it. A client calls with a buy order before receiving the mail. Smith should:",o:["Accept the order","Advise the customer of the change before accepting the order","Not accept the order as it is contrary to firm recommendation","Report to compliance"],c:1,e:"Standard III(B) Fair Dealing: Smith should ensure the client has received the changed recommendation before executing a contrary order."},
{id:227,s:"ETHICS",q:"Which statement about client brokerage commissions violates Code and Standards?",o:["A client may direct a manager to purchase goods and services for that client","Client brokerage should benefit the client and be commensurate with value of services","Client brokerage commissions may be directed to pay for the investment manager's operating expenses","Clients may direct brokerage to third-party research"],c:2,e:"Standard III(A): Client brokerage is a client asset. Using it for manager operating expenses violates the duty of loyalty to clients."},
{id:228,s:"ETHICS",q:"An analyst researching a company that is also a client of the firm's investment banking department and has directors on the firm's board should:",o:["Write the report but disclose only one conflict","Not write the report because directors serve on subsidiaries of the client","Write the report disclosing director relationships only","Write the report disclosing only the IB relationship"],c:1,e:"Standard VI(A): Best practice is to avoid the conflict. Not providing research on companies with both an IB client relationship and director relationship is preferred."},
{id:229,s:"ETHICS",q:"Which statement clearly conflicts with recommended procedures for compliance regarding personal investments?",o:["Firms should disclose personal investing policies to clients","Prior approval must be obtained for personal investment transactions","Personal transactions should not be reported to employers unless mandated by regulators","Employers should compare personal transactions with client transactions"],c:2,e:"Standard VI(B): Employers should regularly compare personal transactions of employees with those of clients — regardless of whether regulators require it."},
{id:230,s:"ETHICS",q:"Bronson is asked by a prominent alumnus to fax confidential endowment fund financial information to a potential donor. Bronson should:",o:["Send the information as disclosure benefits the client","Not send the information to preserve confidentiality","Send it and promptly notify the trustees","Send it as the alumnus has a legitimate interest"],c:1,e:"Standard III(E): Members cannot disclose confidential client information without client permission, even if the disclosure may benefit the client."},
{id:231,s:"ETHICS",q:"Willier overhears another analyst's conflicting opinion at lunch and immediately releases a strong buy recommendation contradicting his prior analysis. Willier:",o:["Violated by failing to separate facts from opinions","Violated because he did not have reasonable and adequate basis for his recommendation","Was in full compliance with Standards","Violated client communication standards"],c:1,e:"Standard V(A): Another analyst's overheard opinion is not an adequate basis for changing a recommendation. Further research and investigation is required."},
{id:232,s:"ETHICS",q:"When asked by investment banking to change a sell recommendation to buy to gain business, the head of brokerage should:",o:["Increase recommendation by one increment only","Place company on restricted list and give only factual information","Assign a new analyst to decide if higher rating is deserved","Comply to maintain the banking relationship"],c:1,e:"Standard I(B): To maintain independence and objectivity, the firm should discontinue issuing recommendations when facing such business pressure."},
{id:233,s:"ETHICS",q:"Albert's business card reads 'CFA Level II.' Tye's marketing material says he participates in the CFA Program and has completed Levels I and II. According to Standards:",o:["Albert violated, Tye did not","Tye violated, Albert did not","Both violated","Neither violated"],c:0,e:"Standard VII(B): Using 'CFA Level II' implies a partial designation — a violation. Stating completion of levels and participation in the program is permitted."},
{id:234,s:"ETHICS",q:"Scott writes 'the dividend will increase by $1.50' knowing it is contingent on uncertain legislation. According to Standards:",o:["Scott violated by using material inside information","Scott violated by failing to separate opinion from fact","Scott violated by basing research on uncertain government action","Scott did not violate since predictions are permitted"],c:1,e:"Standard V(B): Stating 'the dividend will increase' as fact when it is contingent on legislation fails to separate fact from opinion."},
{id:235,s:"ETHICS",q:"To ensure fair treatment of brokerage clients when a new recommendation is made, the best action is:",o:["Informing all people in the firm in advance","Distributing recommendations to institutional clients prior to individual accounts","Minimizing the time between the decision and the dissemination of a recommendation","Distributing to retail clients only"],c:2,e:"Standard III(B): Minimizing time between decision and dissemination helps ensure all clients receive recommendations at approximately the same time."},
{id:236,s:"ETHICS",q:"The mosaic theory holds that an analyst:",o:["Violates Standards if they lack compliance knowledge","Can use material public information and nonmaterial nonpublic information","Should use all available and relevant information","Cannot act on any nonpublic information"],c:1,e:"Mosaic theory: analysts may use material public + nonmaterial nonpublic information. Resulting conclusions may be material without violating Standard II(A)."},
{id:237,s:"ETHICS",q:"A client offers Jurgen additional compensation based on account performance beyond what the firm provides. Jurgen should:",o:["Turn down due to conflicts with other clients","Turn down due to pressure for short-term performance","Obtain permission from employer prior to accepting the compensation arrangement","Accept immediately as it serves the client"],c:2,e:"Standard IV(B): Members may accept additional compensation from clients as long as they obtain written permission from their employer first."},
{id:238,s:"ETHICS",q:"A portfolio manager is asked by a company president to vote profit-sharing plan shares for management-nominated directors. The manager investigates, agrees with management, and votes accordingly. The manager:",o:["Violated by voting as requested by the president","Did not violate because he voted based on independent investigation","Violated by directing trades to brokerage","Violated both proxy voting and brokerage standards"],c:1,e:"Standard III(A): Even though decision coincided with president's wishes, the manager independently investigated and concluded it was in beneficiaries' best interest."},
{id:239,s:"ETHICS",q:"Brown meets a new client and recommends a stock without discussing client needs first. Brown should have:",o:["Explained characteristics of the recommended company","Explained her qualifications as a CFA charterholder","Determined client's needs, objectives, and tolerance for risk before recommending","Done nothing differently if the stock is genuinely undervalued"],c:2,e:"Standard III(C) Suitability: members must understand client needs, objectives, and risk tolerance before making any investment recommendations."},
{id:240,s:"ETHICS",q:"Grey tells clients: Statement I: US bond default risk is virtually zero. Statement II: You will earn 10% a year based on historical performance. Which statement violated Standards?",o:["Neither statement violated","Only statement I violated","Only statement II violated","Both statements violated"],c:2,e:"Standard I(C): Statement I is factual and accurate. Statement II guarantees a specific return — a violation of misrepresentation."},
{id:241,s:"ETHICS",q:"Ward learns that Evans Industries will pay all his expenses for a corporate site visit. Ward should best:",o:["Accept and write an objective report","Pay for all travel expenses himself","Accept but disclose value of services in the report","Accept but only attend research-relevant meetings"],c:1,e:"Standard I(B): Best practice is to avoid the conflict of interest entirely by paying own expenses. Disclosure is a less preferred alternative."},
{id:242,s:"ETHICS",q:"Written consent from the employer is necessary to permit independent practice that could result in compensation:",o:["Only when compensation exceeds employer's normal fee","In competition with a member's or candidate's employer","Only during normal working hours","When the practice involves registered securities"],c:1,e:"Standard IV(A): Members may undertake independent competitive practice only with written consent from their current employer."},
{id:243,s:"ETHICS",q:"Smith is preparing a purchase recommendation on JNI Corporation. XYZ brokerage holds a substantial common stock position in JNI for its own account. This most likely represents:",o:["No conflict since it is normal to hold researched stocks","A conflict that must be disclosed in the research report","A conflict that prevents Smith from writing the report","A conflict requiring senior management approval only"],c:1,e:"Standard VI(A): XYZ's ownership of JNI stock creates a conflict of interest that must be disclosed in the research report."},
{id:244,s:"ETHICS",q:"Michelieu's client average return was 26% but one client's large unsolicited penny stock caused most of the gain. Without it, average was 8%. Michelieu:",o:["Did not violate since the statement is technically true","Did not violate since he is not promising future returns","Violated since the statement misrepresents his track record","Violated since he failed to disclose the outlier client"],c:2,e:"Standard I(C): The statement is technically true but misleading. He has not presented a fair, accurate, and complete picture of his performance."},
{id:245,s:"ETHICS",q:"The best policy to prevent violations of Standard II(A) in a firm with both investment banking and brokerage operations is to:",o:["Permanently prohibit recommendations on IB clients' stocks","Establish physical and informational barriers (firewalls) between the two operations","Monitor exchange of information between departments","Have IB and brokerage report to different committees"],c:1,e:"Standard II(A): Firewalls prevent material nonpublic information from flowing between investment banking and brokerage research operations."},
{id:246,s:"ETHICS",q:"The duty of loyalty, prudence, and care for a pension fund manager hired by a company is owed to:",o:["The management of the company","Participants and beneficiaries of the pension plan","The shareholders of the company","The board of directors"],c:1,e:"Standard III(A): For pension plans and trusts, duty is owed to the ultimate beneficiaries — not to management, shareholders, or the board."},
{id:247,s:"ETHICS",q:"A stated purpose of disclosure in Standard VI(C) Referral Fees is to:",o:["Allow the client to request discounted fees","Help the client evaluate any possible partiality in the recommendation of services","Advise clients of referral arrangements after formal agreement","Allow CFA Institute to monitor referral practices"],c:1,e:"Standard VI(C): Disclosure allows clients and employers to evaluate the full cost of services and any partiality in recommendations they receive."},
{id:248,s:"ETHICS",q:"Rose, a portfolio manager, wants to sell personal holdings in a stock his firm recently upgraded to 'strong buy.' Under Standards:",o:["Rose cannot sell since it would improperly profit from the inflated recommendation","Rose is free to sell his personal holdings once his firm is properly informed","Rose can sell only when a client places a buy order","Rose must wait until the next quarterly period"],c:1,e:"Standard VI(B): Personal transactions may differ from current recommendations as long as the sale does not disadvantage clients and employer is informed."},
{id:249,s:"ETHICS",q:"A member may NOT solicit clients of their current employer for their new employer:",o:["Prior to leaving their current employer","After leaving their current employer using only public information","At any time if they disclose to the current employer","Only if a non-compete agreement was signed"],c:0,e:"Standard IV(A): Soliciting clients of the current employer for a new employer before leaving the current firm is strictly prohibited."},
{id:250,s:"ETHICS",q:"Stafford uses a mutual fund's soft dollar account to pay for CFA Program registration and exam fees. She:",o:["Did not violate since the prospectus disclosed soft dollar policies","Violated since the CFA Program is not research that directly assists investment decision-making","Violated since improving her skills is not a reasonable use of soft dollars","Did not violate if the exam improves her performance"],c:1,e:"Standard III(A): The CFA Program is a personal or firm expense, not research that directly assists investment decisions. Soft dollars cannot pay for it."},
{id:251,s:"ETHICS",q:"Rule states in marketing that he 'consistently received the highest possible scores on Ethics, Alternatives, and Portfolio.' He:",o:["Violated by stating he completed exams in three consecutive years","Violated by stating he received the highest scores on specific topics","Did not violate the Standard","Violated by using the CFA charter name in marketing"],c:1,e:"Standard VII(B): CFA candidates do not receive actual topic scores — only broad groupings. Claiming 'highest possible scores' on specific topics is a misrepresentation."},
{id:252,s:"ETHICS",q:"Mosaic Theory describes the process by which analysts combine:",o:["Material public and material nonpublic information","Material public information and nonmaterial nonpublic information","Nonmaterial public and nonmaterial nonpublic information","Any available information regardless of materiality or public status"],c:1,e:"Mosaic Theory: combining material public + nonmaterial nonpublic information. The resulting analysis may be material without violating Standard II(A)."},
{id:253,s:"ETHICS",q:"Atlantic has limited shares in an oversubscribed IPO suitable for the developing growth strategy, including family-member accounts managed to that strategy. Atlantic should allocate shares:",o:["To family-member accounts only after non-family accounts are fully allocated","On a prorated basis across all developing growth accounts including family accounts","On a prorated basis excluding family-member accounts","To institutional clients first, then retail and family accounts"],c:1,e:"Standard III(B): If family accounts are managed similarly to other client accounts, they should not be excluded from IPO allocations."},
{id:254,s:"ETHICS",q:"Andrews learns about a pending merger from a candidate who mentions it in a job interview. Andrews should least likely:",o:["Wait until next day before trading to allow time for information to become public","Notify all investment managers so no clients are disadvantaged","Place the securities mentioned as part of the merger on the firm's restricted trading list","Terminate the interview and document what was said"],c:2,e:"Standard II(A): Placing on restricted list is the correct action. Trading (even after waiting) and notifying managers (who still cannot trade) are both violations."},
{id:255,s:"ETHICS",q:"A former hedge fund manager offers a $10,000 incentive to advisers who join with $200K in committed investments. A member is:",o:["Eligible if they can arrange enough current clients to switch and disclose the incentive","Not eligible unless currently unemployed since soliciting current employer's clients is prohibited","Not eligible since the incentive offer itself violates Code and Standards","Eligible as long as they leave their current employer before soliciting"],c:1,e:"Standard IV(A): Soliciting clients of current employer is prohibited. Only unemployed members without current client relationships could accept."},
{id:256,s:"ETHICS",q:"ABC Investment Management deviates from its stated policy (incorporating accounts after first full month) to include a new account mid-month after its major holding doubles in value. This:",o:["Did not violate since GIPS allows composites to be updated on large cash flow dates","Did not violate since companies determine when to incorporate accounts","Violated since inclusion produces inaccurate results per stated firm policies","Violated only if the firm claims GIPS compliance"],c:2,e:"Standard III(D): Deviating from firm's stated policies solely to capture the holding's gain produces inaccurate performance calculations — a violation."},
{id:257,s:"ETHICS",q:"Cannan saves client correspondence on her home computer and uses those files after leaving to request recommendations and show work samples to prospective employers. She:",o:["Violated since she did not receive permission to keep or use the files after employment ended","Did not violate since files were created on her own time and computer","Violated since she is prohibited from saving files on personal computers","Did not violate since she used files only for personal career purposes"],c:0,e:"Standard V(C): All files created as part of professional activity are firm property, even those created outside normal work hours. Permission is required after leaving."},
{id:258,s:"ETHICS",q:"Quinn sat for Level III and updates resume: 'In finishing the CFA Program, I improved my skills. I will be eligible for the CFA charter upon completion of required work experience.' He:",o:["Violated by claiming he improved skills through the CFA Program","Violated by incorrectly stating he is eligible for the CFA charter","Did not violate any Standards","Violated by mentioning work experience requirements"],c:1,e:"Standard VII(B): Quinn cannot claim to have 'finished' the CFA Program or be eligible for the charter until official exam results are released. He is still a candidate."},
{id:259,s:"ETHICS",q:"Rodriguez (CFO) casually tells Hart (investment adviser friend) that quarterly sales are 10% above consensus estimates. Hart then buys a large position in a retail ETF that includes Rodriguez's company. Hart:",o:["Violated by investing in the ETF that included Rodriguez's company","Did not violate since she did not invest directly in Rodriguez's company","Did not violate since Rodriguez's comments were not intended to solicit investment","Did not violate since ETFs are diversified instruments"],c:0,e:"Standard II(A): The information is material and nonpublic. Hart's ETF investment was directly correlated with Rodriguez's information — a violation even via an ETF."},
{id:260,s:"ETHICS",q:"Park posts on a review provider's forum that the CFA exam 'had multiple questions about analysis of inventories and taxes.' She:",o:["Violated by purchasing third-party review material","Violated by providing her opinion on exam difficulty","Violated by providing specific information on topics tested on the exam","Did not violate since she was reviewing a commercial product"],c:2,e:"Standard VII(A): Disclosing specific topics tested on the exam (inventories and taxes) is a violation of exam confidentiality requirements."},
{id:261,s:"ETHICS",q:"Paper was one of five managers of an equity fund and was terminated. He presents the entire fund's performance (with written permission) to prospective employers as evidence of past success. He:",o:["Did not violate since he had written permission","Violated by claiming the entire fund's performance as his own without disclosing the team","Violated by including historical results of prior employer","Did not violate since it was a composite, not individual returns"],c:1,e:"Standard III(D): Paper violated Performance Presentation by not disclosing he was one of a team of five managers who achieved those results."},
{id:262,s:"ETHICS",q:"Townsend was appointed to a youth golf program board and includes a small section about the fund-raising campaign in her regular client newsletter. She:",o:["Did not violate any Standards","Violated by soliciting donations from clients through the newsletter","Violated by not getting organization's approval before soliciting clients","Violated by using client contact information for charitable purposes"],c:0,e:"Standard III(E): Townsend did not provide client contact information to the organization. Mentioning the campaign in her own newsletter is acceptable."},
{id:263,s:"ETHICS",q:"Jimmy Lan, while still at Pacific, makes plans on weekends to start JL Consulting. After leaving, he builds earnings models using knowledge from Pacific and contacts former clients via public sources. His actions:",o:["Comply with Standards assuming no breach of non-compete agreement","Violate Standards since he made plans while still employed","Violate Standards since he misappropriated financial models","Violate Standards since general knowledge from prior employer is confidential"],c:0,e:"Standard IV(A): Lan does not use company time, does not misappropriate information, and contacts former clients only via public sources — all permissible."},
{id:264,s:"ETHICS",q:"Davidson, while at Integrity, starts a part-time consulting business providing advice to trustees without informing Integrity. This:",o:["Does not violate since it is part-time outside work","Does not violate since there is no conflict with Integrity's clients","Violates since the consulting business is a violation of Standards","Violates since both the consulting business and meetings with Integrity clients are violations"],c:2,e:"Standard IV(B): Members must obtain permission before accepting compensation for services that might conflict with employer's interest, even during non-work hours."},
{id:265,s:"ETHICS",q:"Katz plans to recommend her father's hedge fund strategy to a pension client because she believes it meets all criteria. Best course of action:",o:["Not present this strategy and recommend another","Disclose the potential conflict to the pension client when discussing the recommendation","Disclose only to her employer and follow their guidance","Skip the recommendation since this is an inherent conflict"],c:1,e:"Standard VI(A): Conflicts must be disclosed to affected parties. Katz can make the recommendation if she believes it is best, but must disclose the conflict to the pension client."},
{id:266,s:"ETHICS",q:"Woods believes his colleague Clarke is engaged in unethical trading violating local securities laws. Woods should:",o:["Not take action since he is not directly involved","Report Clarke to ABC's trading supervisor or compliance department","Report Clarke to the appropriate governmental regulatory organization","Document his observations and wait for more evidence"],c:1,e:"Standard I(A): Members aware of employer engagement in unethical activity should attempt to stop the behavior by reporting to a supervisor or compliance department."},
{id:267,s:"ETHICS",q:"Smith was named to a supervisory position but says she cannot discharge responsibilities due to inadequate compliance system. She should:",o:["Require the firm to adopt the CFA Institute Code and Standards","Require supervised employees to adopt the Code and Standards","Decline in writing to accept supervisory responsibility until the firm adopts reasonable procedures","Implement her own compliance procedures within her department"],c:2,e:"Standard IV(C): If a member cannot discharge supervisory responsibilities due to inadequate compliance systems, they should decline in writing until the firm adopts reasonable procedures."},
{id:268,s:"ETHICS",q:"Sato selected Capital Investments as pension manager based on excellent performance. Peters, Sato's friend, then accepted a lucrative job with Capital after the selection. Which charterholder violated Standards?",o:["Both violated","Peters violated","Sato violated","Neither violated"],c:3,e:"Standard I(B): No indication of inappropriate behavior. Selection was based on excellent performance; Peters joined Capital based on her own track record. No violation."},
{id:269,s:"ETHICS",q:"A CFA candidate defaulted on a bank loan (to cover wedding costs) and later declared personal bankruptcy due to medical bills and job loss. Do the loan defaults violate Standard I(D)?",o:["No","Yes, with regard to the first loan default","Yes, with regard to the second loan default","Yes, both loan defaults violate"],c:0,e:"Standard I(D): Bankruptcy due to poor financial choices or unfortunate personal circumstances (without fraud or deceit) is not a violation of the Standards."},
{id:270,s:"ETHICS",q:"Huerta writes a weekly newsletter distributed free to thousands. She changes a buy to sell on a stock she actively manages. She should distribute the new recommendation to:",o:["Newsletter recipients first","Asset management clients first","Newsletter recipients and asset management clients simultaneously","The firm's compliance department first"],c:1,e:"Standard III(A): Members must place clients' interests first. Asset management clients must receive the changed recommendation before newsletter recipients."},
{id:271,s:"ETHICS",q:"Deschutes, part of a 10-person equity team, shows performance at an interview. She has written permission, discloses team effort, but also provides names of institutional clients. She violated Standards regarding:",o:["The stock portfolio's performance history","Her contribution to the portfolio's returns","Providing details of the institutional clients","None — all actions were appropriate"],c:2,e:"Standard III(E): Deschutes violated Preservation of Confidentiality by disclosing specific client details during the interview with a competing firm."},
{id:272,s:"ETHICS",q:"Younis manages an investment pool for family and non-family members charging management fees. He least likely needs to disclose which to his employer?",o:["Board activities on golf equipment companies","Family investment pool management","Non-family member management fees","Time spent on investment pool management"],c:0,e:"Standard IV(B)/VI(A): Golf equipment board service is unrelated to financial services and unlikely to create conflicts. The investment pool (in potential competition) must be disclosed."},
{id:273,s:"ETHICS",q:"Schleif discovers a model error changing a buy recommendation to sell. She emails the revision only to investment banking clients. One week later she sells personal holdings. She most likely violated:",o:["Fair Dealing","Priority of Transactions","Diligence and Reasonable Basis","Record Retention"],c:0,e:"Standard III(B) Fair Dealing: Schleif selectively distributed only to investment banking clients, not all clients who received the initial recommendation."},
{id:274,s:"ETHICS",q:"Rodrigues reviews external advisers by examining investment process, code of ethics, published return information, and compliance framework. He most likely violated due diligence with regards to:",o:["Adherence to strategy","Performance measures","Internal control procedures","None — his review was comprehensive"],c:0,e:"Standard V(A): Due diligence on external advisers must include reviewing adherence to stated strategy — a critical element that Rodrigues omitted from his review."},
{id:275,s:"ETHICS",q:"Barnes provides financial planning through a network of contractors. Each contractor provides discounts based on referrals. What steps should Barnes take consistent with Standards?",o:["Have independent contractors approved by the insurance company","List the consideration on monthly client invoices","Inform potential clients about his arrangement with contractors before they hire him","Disclose referral arrangements only when issues arise"],c:2,e:"Standard VI(C): Referral fee disclosures should be made before entry into any formal agreement for services — so clients can consider potential bias or harm."},
{id:276,s:"ETHICS",q:"Chin works in a country where insider trading is not prohibited and follows local laws. The most appropriate action consistent with CFA Standards is:",o:["Follow the CFA Code and Standards","Disclose her political advocacy to clients","Continue her current investment strategy that follows local law","Apply the higher standard only when asked by clients"],c:0,e:"Standard I(A): When local law is less strict than the Code and Standards, members must adhere to the Code and Standards."},
{id:277,s:"ETHICS",q:"Duyck claims to do his own research but relies entirely on his broker's recommended list without conducting his own analysis. His recommended list least likely violates:",o:["Fair Dealing","Misrepresentation","Diligence and Reasonable Basis","Client confidentiality"],c:0,e:"Standard III(B) Fair Dealing is not violated — he does not discriminate against any clients. However, Standards I(C) Misrepresentation and V(A) are violated."},
{id:278,s:"ETHICS",q:"Atlantic Capital Management has limited shares in a popular oversubscribed IPO determined to be a prudent addition to the developing growth strategy, which includes family-member accounts. Atlantic should allocate the shares:",o:["To family-member accounts only after non-family accounts are allocated","On a prorated basis across all developing growth accounts including family accounts","Excluding the family-member accounts entirely","To institutional clients first then retail then family"],c:1,e:"Standard III(B): Family accounts managed similarly to other client accounts should not be excluded. Prorated allocation across all applicable accounts is proper."},
{id:279,s:"ETHICS",q:"Zagoreos (head of a government pension plan) receives 10% of fund management fees and distributes half to staff as cash incentives, without documentation. She least likely violated:",o:["Referral fees","Loyalty, Prudence and Care","Additional Compensation Arrangements","All three were violated"],c:0,e:"Standard VI(C) Referral Fees: The payments are not for recommending products or services to clients — they are performance payments. Standards III(A) and IV(B) are violated."},
{id:280,s:"ETHICS",q:"Holmberg (CFA exam candidate) uses a formula from a piece of paper that fell from a nearby candidate's pocket onto her desk. Holmberg:",o:["Compromised her exam and violated the Standards","Was free to act on information that came to her accidentally","Is responsible for notifying exam proctors of her neighbor's violation","Did not violate since the information came to her accidentally"],c:0,e:"Standard VII(A): Holmberg's use of the formula compromised the validity of her exam, regardless of how the information came to her attention."},
{id:281,s:"ETHICS",q:"Cohen (CFA candidate) abbreviates CFA trademarks on social media and blogs about formulas tested or not tested on the exam. Which activity can he continue in compliance with Standards?",o:["Use of abbreviations for CFA trademarks","Claiming retirement planning expertise in his specialty area","Blogging about broad topical areas tested or not tested on the CFA exam","All three activities are compliant"],c:1,e:"Standard VII(A): Claiming expertise in a specialty area is permitted. Abbreviating CFA trademarks and disclosing exam content (tested or not tested) are both violations."},
{id:282,s:"ETHICS",q:"PNW Bank's marketing manager Coursing trades securities before the Investment Monthly magazine is published, knowing it causes prices to rise. She least likely violated:",o:["Priority of Transactions","Diligence and Reasonable Basis","Material Nonpublic Information","Knowledge of the Law"],c:1,e:"Standard V(A) Diligence and Reasonable Basis: Coursing is not analyzing investments for clients — she has no investment analysis duties. She violated Standards II(A) and VI(B)."},
{id:283,s:"ETHICS",q:"Arun facilitated introduction of a fund manager to a pension plan, was paid a lump sum upfront, then received an undisclosed introductory fee from the fund manager. He:",o:["Did not violate since the arrangement was pre-existing","Violated and should have refused the introductory fee since the arrangement was not disclosed before Ramport's appointment","Violated only by not disclosing to the client at time of the arrangement","Did not violate since the pension plan was satisfied with the manager"],c:1,e:"Standard VI(C): Arun should have refused the fee. Disclosure of the arrangement was required before Ramport's appointment for it to be acceptable."},
{id:284,s:"ETHICS",q:"Both Lopez (who develops a new model after leaving OneWorld) and Sanchez (who continues using the model Lopez primarily built at OneWorld) conform to Standards because:",o:["Lopez takes a copy of the model with permission; Sanchez uses it normally","Both violate since the model was jointly created","Both conform — OneWorld owns the model Sanchez uses; Lopez creates a new model from his pre-employment work","Lopez violated by duplicating OneWorld model features"],c:2,e:"Standards I(C) and IV(A): OneWorld owns the model Sanchez uses. Lopez creates a separate model from his pre-employment simplified model — both are compliant."},
{id:285,s:"ETHICS",q:"Saar (head of compliance) reviews an investment management agreement. Which is least likely a conflict of interest requiring disclosure?",o:["The group subsidizes staff loans for share purchases","Management fees are frequently loss leaders for brokerage","Asset managers are likely to support corporate finance deals","All three require disclosure"],c:0,e:"Standard VI(A): Staff loan subsidies for share purchases are a funding mechanism, not a conflict affecting objectivity. IB support and cross-subsidized fees are cross-departmental conflicts requiring disclosure."},
{id:286,s:"ETHICS",q:"Miffitt overhears competitors plan to manipulate a micro-cap stock price down, then sells all client holdings and buys back at the lower price. Miffitt least likely violated:",o:["Market manipulation","Preservation of confidentiality","Material nonpublic information","Loyalty to clients"],c:1,e:"Standard III(E) Preservation of Confidentiality: This standard involves information about clients. Miffitt violated Standards II(A) (trading on overheard MNP info) and II(B) (adding to manipulation by selling)."},
{id:287,s:"ETHICS",q:"Morales provides evidence of supervisor fraud to a government whistleblower program following local law requirements, including copies of client account statements. He:",o:["Did not violate any Standards","Violated duties to employers","Violated preservation of confidentiality","Violated both duties to employers and confidentiality"],c:0,e:"Standard III(E) and IV(A): By following requirements of local law through the whistleblower program, Morales has not violated confidentiality or duties to employers."},
{id:288,s:"ETHICS",q:"Kumar (world-renowned mining analyst) is invited by Cerberus Mining for a mine tour including a safari outing. He should accept only which paid travel from Cerberus?",o:["Ground transportation to Krueger National Park safari","Economy class round trip from London to Johannesburg","Flights on a private airplane to remote mining sites in South Africa","All expenses including hotel and meals during mine visits"],c:2,e:"Standard I(B): Only the private airplane to remote sites (necessary since commercial flights are unavailable) is appropriate. Safari and London flights could create independence concerns."},
{id:289,s:"ETHICS",q:"Steyn (trading desk head at a domestic equity firm) pays soft commissions for which service most likely violates Standard III(A)?",o:["Equity research reports","Investment conference attendance","Database services for offshore investments","Domestic bond research"],c:2,e:"Standard III(A): Client brokerage must benefit clients. An offshore investment database does not benefit clients of a firm specializing in domestic equities."},
{id:290,s:"ETHICS",q:"Jones (natural gas analyst) builds a mosaic from public statements and the CEO's unreachable status (on business trip to NE Pennsylvania). She recommends Pure Energy. Has either Jones or Wong violated Standards?",o:["No","Yes, Jones's recommendation is based on insider information","Yes, both Jones and Wong acted on insider information","Possibly but more investigation is needed"],c:0,e:"Standard II(A): Jones used Mosaic Theory — combining non-material nonpublic information (CEO location) with material public information. No violation."},
{id:291,s:"ETHICS",q:"Blake (retired, owns 20,000 shares) posts on internet bulletin boards 'this stock is going up, now is the time to buy' intending to create interest and sell his shares. Blake violated Standard relating to:",o:["Market Manipulation but not Avoid or Disclose Conflicts","Both Market Manipulation and Avoid or Disclose Conflicts","Neither standard","Avoid or Disclose Conflicts but not Market Manipulation"],c:0,e:"Standard II(B): Blake violated Market Manipulation by artificially inflating trading volume. Standard VI(A) requires disclosure to clients and employers — not the public."},
{id:292,s:"ETHICS",q:"Wong delays his buy recommendation on Nolvec Inc. to allow his brother to buy shares at a lower price. Wong least likely violated Standard relating to:",o:["Duty to clients","Reasonable basis for investment analysis","Priority of transactions","Independence and objectivity"],c:1,e:"Standard V(A) Reasonable Basis: Nothing suggests Wong lacks reasonable basis for his conclusion about Nolvec. Standards III(A) and VI(B) are violated by the delay."},
{id:293,s:"ETHICS",q:"O'Sullivan issues press releases about Mallory's excellent prospects and publishes a buy recommendation, having received 40,000 Mallory shares as payment. He must disclose stock ownership in:",o:["The press releases only","The research report only","Both the press release and the research report","Neither since he operates through separate companies"],c:2,e:"Standards I(B) and VI(A): All matters that could impair objectivity must be disclosed in all relevant communications — both the press releases and research report."},
{id:294,s:"ETHICS",q:"Piedmont notifies his employer in writing of plans to manage family portfolios for a percentage of profits. Two weeks later he begins managing without receiving written consent. He violated:",o:["Additional compensation Standard only","Avoid or disclose conflicts Standard only","Both additional compensation and avoid or disclose conflicts","Neither Standard — notification was given"],c:2,e:"Standards IV(B) and VI(A): He failed to receive written consent before beginning (additional compensation) and failed to disclose substantial competitive time (conflicts)."},
{id:295,s:"ETHICS",q:"Chen's marketing materials show 3-year, 2-year, 1-year returns with a past performance footnote. He does not claim GIPS compliance and includes un-audited semi-annual returns noted as unverified. He:",o:["Did not violate any Standards","Violated by including un-audited and unverified results","Violated by not adhering to GIPS standards","Violated by not including a 10-year performance history"],c:0,e:"Standard III(D): The Standards do not require GIPS compliance, auditing, or verification. Making reasonable efforts to ensure fair and accurate presentation is sufficient."},
{id:296,s:"ETHICS",q:"Mancini approves flexible terms allowing a large hedge fund to trade mutual funds six hours after US market close — an activity prohibited by US regulators. Mancini violated:",o:["Only Standard relating to fair dealing","Only Standard relating to knowledge of the law","Both Standards relating to knowledge of the law and to fair dealing","Only Standards relating to fiduciary duties"],c:2,e:"Standards I(A) and III(B): Mancini allows an activity prohibited by US regulators (knowledge of the law) and treats one client with advantages not available to others (fair dealing)."},
{id:297,s:"ETHICS",q:"Nelson manages family accounts but allocates remaining shares from block trades to family only after other clients receive their allocations. Best course of action:",o:["Treat the family account like any other client account","Treat the account like other employee accounts","Remove himself from direct involvement by transferring to another professional","Continue current practice since family comes second by choice"],c:0,e:"Standard III(B): Nelson's family is entitled to the same treatment as any other client of the firm. Treating them differently in any direction is a breach of fair dealing."},
{id:298,s:"ETHICS",q:"Peek, CFA, co-founded an investment club that has been inactive for over a year. He does not disclose it in his annual stock ownership report. His actions least likely violate:",o:["Misrepresentation","Transaction priority","Conflicts of interest","Duties to employer"],c:1,e:"Standard VI(B) Priority of Transactions: No indication the investment club is trading ahead of clients. Standards I(C) and VI(A) are violated by the non-disclosure."},
{id:299,s:"ETHICS",q:"Chandarana posts that being a CFA candidate helped him get a job and notes relief that his new employer did not ask about being fired. He least likely violated Standard relating to:",o:["Misconduct","Loyalty to employers","Reference to the CFA Program","Duties to prospective clients"],c:2,e:"Standard VII(B): Stating that being a CFA candidate helped with employment does not overstate competency or imply superior performance — no violation of VII(B)."},
{id:300,s:"ETHICS",q:"Covington received prior clearance for Stock A (100 shares) and Stock B (150 shares) via Easy Trade, valid only that trading day. Two days later, she purchases 250 shares of Stock B only. She:",o:["Did not violate any Standards","Violated Standard relating to diligence and reasonable basis","Violated relating to employer's compliance procedures","Violated Priority of Transactions"],c:2,e:"Standard VI(B): Prior clearance was approved only for that trading day, for specific quantities listed. Trading outside those parameters violates employer compliance procedures."},
{id:301,s:"ETHICS",q:"Wong buys photocopied CFA review materials (from previous year) from Leung. Who violated Standards?",o:["Only Leung","Both Wong and Leung","Neither Wong nor Leung","Only Wong"],c:1,e:"Standard I(A): Photocopying copyrighted material regardless of year violates applicable laws. Both Leung (made copies) and Wong (purchased copies) knowingly participated."},
{id:302,s:"ETHICS",q:"O'Keefe hires Carlson for due diligence on North American asset managers solely because he has a CFA charter. To avoid violating Standards, O'Keefe should most likely:",o:["Undertake a sampling of suitability of North America for clients","Do the due diligence herself","Undertake a due diligence exercise on Mark Carlson and Carlson Consulting","Accept Carlson's credentials as sufficient for delegation"],c:2,e:"Standard V(A): Having a CFA charter does not automatically make someone qualified for every task. O'Keefe must perform due diligence on the person she is delegating to."},
{id:303,s:"ETHICS",q:"Bosno is offered personal incentives to approve a risky investment and threatened with losing the Sovereign Wealth Fund account if he refuses. After quick analysis he determines it is too risky. If he approves, which Standard is LEAST likely violated?",o:["Loyalty, Prudence, and Care","Diligence and Reasonable Basis","Additional Compensation Arrangements","Knowledge of the Law"],c:1,e:"Standard V(A): Even a quick analysis can demonstrate diligence if appropriate for the situation. Standards III(A) and IV(B) are clearly violated by approving an unsuitable investment under pressure."},
{id:304,s:"ETHICS",q:"Eruobo (General Partner) did not inform Limited Partners about a 50%+ increase in imported lighting costs (5% of total costs). Overall project costs remain within the 15% budget variance cap. Did Eruobo violate Standards?",o:["No — the cost increase did not trigger the disclosure obligation","Yes, because returns are lower than partners expected","Yes, because he did not disclose increased costs to his partners","Yes, because cost increases always require immediate disclosure"],c:0,e:"No violation: the cost increase did not cause overall costs to exceed the 15% contingency agreed in the partnership. No disclosure obligation was triggered."},
{id:305,s:"ETHICS",q:"Burnett manages a fund that only invests in environmentally friendly companies. After a merger she holds utility company shares (terrible environmental record) to collect two remaining dividends before selling. She most likely violated Standard relating to:",o:["Suitability","Avoid or disclose conflicts","Independence and objectivity","Performance presentation"],c:0,e:"Standard III(C) Suitability: The utility is not suitable for a fund that only invests in environmentally friendly companies — holding it violates the fund's stated mandate."},
{id:306,s:"ETHICS",q:"Kassim (research analyst) buys stocks in his personal account immediately before publishing buy recommendations. Head of compliance Musa questions him; no personal trading policies exist. Who violated Standards?",o:["Only Musa","Only Kassim","Both Musa and Kassim","Neither since no policies existed"],c:2,e:"Standards IV(C) and VI(B): Kassim violated Priority of Transactions; Musa violated Responsibilities of Supervisors by not ensuring policies were in place to prevent such violations."},
{id:307,s:"ETHICS",q:"Kelso disagrees with two sell recommendations written by her team. In a webcast open only to institutional clients, she states these stocks are buys. She least likely violated:",o:["Fair Dealing","Communication with Clients and Prospective Clients","Diligence and Reasonable Basis","Independence and Objectivity"],c:2,e:"Standard V(A) Diligence and Reasonable Basis: The team's recommendation was based on sound research — she has adequate basis for her own view. Standards III(B) and V(B) are violated."},
{id:308,s:"ETHICS",q:"Caldwell (CIO of an emerging market fixed income fund) shifts into US government securities due to commodity volatility, noting it only in the annual report. This least likely violated Standards concerning:",o:["Diversification","Communication with clients","Investments outside his mandate","All three were violated"],c:0,e:"Standards III(C) and V(B): Communication was inadequate (annual report only, not ongoing); US government securities were outside the emerging market mandate. Diversification itself was not violated."},
{id:309,s:"ETHICS",q:"Chan Liu observes Pacific traders front-running client orders and marketing staff spreading false information about a stock in internet forums. The most appropriate first step for Liu is:",o:["Report the observed activities to her employer","Remove her name from the micro cap stock research report","Publicly refute the false information posted on internet forums","Immediately contact the securities regulator"],c:0,e:"Standard I(A): First step is to stop the behavior by reporting to a supervisor or compliance department. Inaction may be construed as participation in the violations."},
{id:310,s:"ETHICS",q:"Holm directs most client trades to RRT despite higher commissions because RRT refers clients to Holm. He does not disclose this arrangement to clients. Holm violated Standards relating to:",o:["Only referral fees","Only loyalty, prudence, and care","Both referral fees and loyalty, prudence, and care","Market manipulation"],c:2,e:"Standards III(A) and VI(C): Paying higher commissions in exchange for referrals does not benefit clients (violates III(A)); failing to disclose referral arrangements violates VI(C)."},
{id:311,s:"ETHICS",q:"After completing Level II, Banerjee posts: Comment 1: CFA Institute must revise topic area weights. Comment 2: There were no questions on GIPS standards. Which comment violated Standards?",o:["Comment 1 only","Comment 2 only","Both Comment 1 and Comment 2","Neither comment violated"],c:1,e:"Standard VII(A): Members may express disagreement with CFA Institute policies (Comment 1 is OK). Disclosing what was or was not tested on the exam (Comment 2) is a violation."},
{id:312,s:"ETHICS",q:"The Standards require a member to inform which parties of any benefit received for client referrals?",o:["Only his employer","Only his potential clients","Both his employer and his potential clients","CFA Institute and his employer"],c:2,e:"Standard VI(C): Members must inform their employer, clients, and prospective clients of any benefit received for referrals of customers and clients."},
{id:313,s:"ETHICS",q:"Charles states in his resume: 'CFA charterholders achieve better performance results' and 'As a CFA charterholder, I am the most qualified to manage client investments.' He violated:",o:["Only the first statement","Only the second statement","Both statements","Neither statement since these are subjective opinions"],c:2,e:"Standard VII(B): Both statements imply superior performance and competency from the CFA designation — these are prohibited improper references to the designation."},
{id:314,s:"ETHICS",q:"According to Standard III(B) Fair Dealing, when members disseminate investment recommendations they must treat clients in a:",o:["Fair and equal manner","Fair and impartial manner","Equal and impartial manner","Personalized and individualized manner"],c:1,e:"Standard III(B): 'Fair and impartial' is the correct standard — not 'equal' since it is impossible to reach all clients at exactly the same time."},
{id:315,s:"ETHICS",q:"Zapata promises investors returns of up to 12% per year. No investments are made and investors are fully repaid. She violated Standards because of:",o:["Return of capital to investors","The promised returns she guaranteed","The investment mandate she described","All three reasons"],c:1,e:"Standard I(C): Guaranteeing a specific return on volatile investments is a misrepresentation violation. Returning capital and describing an investment mandate are not violations."},
{id:316,s:"ETHICS",q:"Kawasaki has informal referral arrangements with accountants and lawyers with no cash payments — just expectation of equal referrals over time. He does not mention this to clients. He:",o:["Did not violate since no cash changed hands","Violated Standard relating to referral fees","Violated Standard relating to communication with clients","Violated both referral fees and fair dealing"],c:1,e:"Standard VI(C): Even non-cash referral arrangements (quid pro quo referrals) must be disclosed. The arrangement provides benefit and creates potential partiality."},
{id:317,s:"ETHICS",q:"A member claims a professional designation she has not earned. This most likely violates Standards relating to:",o:["Loyalty only","Misconduct only","Both loyalty and misconduct","Misrepresentation only"],c:2,e:"Standards I(D) and IV(A): Claiming an unearned designation involves dishonesty and fraud (Misconduct I(D)) and could harm the employer (Loyalty IV(A))."},
{id:318,s:"ETHICS",q:"Which statement is accurate according to Standard IV(C) Responsibilities of Supervisors?",o:["Statement 1 only: member must ensure supervised persons comply with Code and Standards","Statement 2 only: member must adopt CFA Code and Standards if firm has no compliance system","Both statements are accurate","Neither statement is accurate"],c:0,e:"Standard IV(C): Statement 1 is accurate. Statement 2 is incorrect — if unable to discharge duties due to inadequate compliance system, decline supervisory responsibility in writing."},
{id:319,s:"ETHICS",q:"Run accepts a front-row ticket to a sold-out match from a client (without informing employer) but gets employer permission to accept a cash performance incentive. He violated Standard relating to:",o:["Loyalty, prudence, and care only","Additional compensation arrangements only","Both loyalty, prudence, and care and additional compensation arrangements","Independence and objectivity only"],c:1,e:"Standard IV(B): Taylor must inform employer and obtain consent for the front-row ticket (not just the cash incentive) before accepting. The ticket without consent violates IV(B)."},
{id:320,s:"ETHICS",q:"Members are required to obtain permission from their employer before accepting additional compensation from:",o:["Clients only","Third parties only","Both clients and third parties","Neither — additional compensation is always permitted"],c:2,e:"Standard IV(B): Permission required for both direct client compensation and indirect compensation or benefits received from third parties."},
{id:321,s:"ETHICS",q:"Jacobs manages client accounts and on weekends teaches an investment course for a fee. She is also developing marketing materials for a new competing business. She:",o:["Did not violate — both activities are permissible","Violated by accepting a fee from the business school","Violated by developing marketing materials for her competing business","Violated both activities"],c:0,e:"Standard IV(A): Weekend teaching is not in competition with the employer. Making arrangements for a competing business on own time outside the office is permissible."},
{id:322,s:"ETHICS",q:"A member offered additional compensation from a third party for services that conflict with employer's interest must:",o:["Decline in all cases","Notify employer immediately after receiving it","Obtain written consent from employer and the third party before accepting","Notify CFA Institute of the arrangement"],c:2,e:"Standard IV(B): Must obtain written consent from all parties involved before accepting compensation that might compete with or conflict with employer's interest."},
{id:323,s:"ETHICS",q:"Hicks provides a friend with email addresses of former clients for charitable donation solicitation. Colleague Moll declares personal bankruptcy due to medical bills without informing supervisor. Who violated Standards?",o:["No violation by either","Moll violated","Hicks violated","Both violated"],c:2,e:"Standard III(E): Confidentiality obligations continue even after the client relationship ends. Hicks violated by providing former clients' contact information. Moll's bankruptcy (medical bills, no fraud) is not a violation."},
{id:324,s:"ETHICS",q:"A candidate tells her brother after the exam how glad she was that no questions about the binomial model were asked. She violated Standards:",o:["Only by providing specific information on topics tested on the exam","Only by expressing her opinion on exam difficulty","By both disclosing exam content and expressing opinions","She did not violate since it was a private conversation"],c:0,e:"Standard VII(A): Disclosing that the binomial model was not tested violates exam confidentiality regardless of the audience. Expressing opinions about exam difficulty is permitted."},
{id:325,s:"ETHICS",q:"Taylor accepts a front-row ticket to a sold-out match from a client (without informing employer) and also accepts a cash performance incentive with employer permission. He violated Standard relating to:",o:["Loyalty, prudence, and care only","Additional compensation arrangements only","Both additional compensation and loyalty, prudence, and care","Independence and objectivity only"],c:1,e:"Standard IV(B): The front-row ticket requires employer notification and consent before acceptance. Failing to do so violates IV(B)."},
{id:326,s:"ETHICS",q:"Andrews allocates a prorated share of an oversubscribed IPO to all fee-paying suitable clients including his brother whose account is managed like any other standard fee-paying account. He:",o:["Did not violate any Standards","Violated by including his brother in the allocation","Violated by failing to exclude family members from IPO allocations","Violated by not buying IPO for all clients regardless of suitability"],c:0,e:"Standard III(B): If family accounts are managed like other standard fee-paying client accounts, they should not be excluded. Pro-rata allocation is appropriate."},
{id:327,s:"ETHICS",q:"Recommended procedures for compliance with Standard IV(C) Responsibilities of Supervisors include:",o:["Encouraging employers to provide a copy of the firm's code of ethics to clients","Requiring firms to adopt the CFA Code and Standards","Consolidating code of ethics and specific policies into one document","Conducting quarterly reviews of all employee transactions"],c:0,e:"Standard IV(C): Firms should provide their codes of ethics to clients and should keep codes of ethics separate from detailed compliance procedures."},
{id:328,s:"ETHICS",q:"According to Standards, a firm's code of ethics should:",o:["Only be written in plain language","Only be integrated in the firm's compliance procedures","Both be written in plain language and integrated in compliance procedures","Be created by each employee individually"],c:0,e:"Standard IV(C): Stand-alone codes of ethics should be written in plain language and address general fiduciary concepts — they should not be mingled with compliance procedures."},
{id:329,s:"ETHICS",q:"A member discloses client information requested by CFA Institute's PCP investigation. Applicable local law requires maintaining client confidentiality. He most likely violated Standard relating to:",o:["Knowledge of the Law","Fair Dealing","Preservation of Confidentiality","Duties to Employer"],c:0,e:"Standard I(A): If applicable law prohibits disclosure, the member must comply with local law. Standard III(E) states PCP disclosures are permissible only 'when permissible under applicable law.'"},
{id:330,s:"ETHICS",q:"A member most likely violates Standard II(B) Market Manipulation if he:",o:["Secures a dominant position in a stock to win a proxy vote","Exploits market inefficiencies in a thinly traded penny stock","Places both buy and sell orders of a stock at the same price to increase trading volume","Shorts a stock before announcing a research report"],c:2,e:"Standard II(B): Placing simultaneous buy and sell orders at the same price artificially inflates trading volume — a clear form of transaction-based manipulation."},
{id:331,s:"ETHICS",q:"A supervisor most likely violates Standard IV(C) if she:",o:["Accepts supervisory duties before the firm has a code of ethics","Delegates supervisory duties to subordinates without compliance experience","Relies on a subordinate's statements without initiating an assessment of a potential violation","Reports violations only when they are confirmed"],c:2,e:"Standard IV(C): Once a supervisor learns of a potential violation, she must promptly initiate her own assessment. Relying only on the employee's statements is insufficient."},
{id:332,s:"ETHICS",q:"Rein makes a brief performance presentation. According to Standard III(D), must she make detailed supporting information available to clients upon request?",o:["No","Yes, only to current clients","Yes, to both current clients and to prospective clients","Yes, but only after clients request it formally in writing"],c:2,e:"Standard III(D): If the presentation is brief, members must make available detailed supporting information to clients AND prospective clients upon request."},
{id:333,s:"ETHICS",q:"Which is a violation of Standard VII(A) Conduct as Participants in CFA Institute Programs? A candidate:",o:["Discusses broad topic areas covered in the curriculum in an online forum","Tells her brother that no questions about the binomial model were asked","Publishes disappointment about the CFA Program on social media","Purchases third-party review material for exam preparation"],c:1,e:"Standard VII(A): Disclosing topics not tested on the exam is prohibited. Discussing curriculum content and expressing opinions about the CFA Program are permitted."},
{id:334,s:"ETHICS",q:"Lee, CFA, manages portfolios including his brother's (a standard fee-paying client). For an oversubscribed IPO he subscribes only for suitable clients and allocates pro-rata including his brother. His actions are:",o:["Consistent with Standards","Inconsistent — he should have allocated only after non-family clients","Inconsistent — he fails to allocate to all clients","Inconsistent — he should not manage his brother's account"],c:0,e:"Standard III(B): Brother's account is managed like other standard fee-paying client accounts. Including him in pro-rata IPO allocation for which the IPO is suitable is appropriate."},
