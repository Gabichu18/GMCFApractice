<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFA Level I — Study Platform</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{background:#07090f;color:#e6ecf5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
:root{
  --bg:#07090f;--bg2:#0c1019;--bg3:#101520;--surf:#141a27;--surf2:#192030;
  --border:#1e2b40;--border2:#253448;--gold:#f0b429;--gold2:#ffd166;
  --golddim:rgba(240,180,41,0.13);--txt:#e6ecf5;--txt2:#8999b5;--txt3:#546070;
  --green:#20d0a0;--greendim:rgba(32,208,160,0.13);--red:#f05060;--reddim:rgba(240,80,96,0.13);
  --blue:#5fa0f5;--bluedim:rgba(95,160,245,0.13);--sw:240px;--r:10px;--rs:7px
}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
#sidebar{width:var(--sw);min-width:var(--sw);height:100vh;position:fixed;top:0;left:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;overflow-y:auto;transition:transform .2s ease}
.sb-logo{padding:20px 16px 14px;border-bottom:1px solid var(--border)}
.sb-logo h2{font-size:1.1rem;font-weight:700;color:var(--gold)}
.sb-logo small{font-size:.7rem;color:var(--txt3);font-family:'Courier New',monospace}
.sb-nav{flex:1;padding:10px 8px}
.nav-section{font-size:.62rem;font-weight:700;letter-spacing:.1em;color:var(--txt3);text-transform:uppercase;padding:10px 8px 3px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;font-size:.82rem;color:var(--txt2);transition:background .15s,color .15s;margin:1px 0;user-select:none}
.nav-item:hover{background:var(--surf);color:var(--txt)}
.nav-item.active{background:var(--golddim);color:var(--gold)}
.ni{font-size:.9rem;width:18px;text-align:center}
.sb-foot{padding:12px 8px}
.exam-btn{width:100%;padding:10px;background:var(--gold);color:#070900;border:none;border-radius:var(--rs);font-size:.83rem;font-weight:700;transition:background .15s,transform .1s}
.exam-btn:hover{background:var(--gold2);transform:translateY(-1px)}
#wrap{margin-left:var(--sw);flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:50px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:50}
#menu-tog{background:none;border:none;color:var(--txt2);font-size:1.1rem;display:none;padding:4px 8px;border-radius:5px}
#menu-tog:hover{background:var(--surf)}
.topbar-title{font-size:.8rem;color:var(--txt3);font-family:'Courier New',monospace}
.streak{margin-left:auto;background:var(--golddim);border:1px solid rgba(240,180,41,0.2);color:var(--gold);font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px;font-family:'Courier New',monospace}
#main{flex:1;padding:26px 28px;max-width:1100px;width:100%}
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.card-title{font-size:1rem;font-weight:700;color:var(--txt);margin-bottom:14px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.stat-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.stat-label{font-size:.68rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.stat-val{font-size:2rem;font-weight:800;color:var(--txt);line-height:1;font-family:'Courier New',monospace}
.stat-sub{font-size:.7rem;color:var(--txt3);margin-top:4px}
.welcome{background:linear-gradient(135deg,var(--surf) 0%,var(--surf2) 100%);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px;margin-bottom:22px}
.welcome h1{font-size:1.3rem;font-weight:700;color:var(--txt);margin-bottom:3px}
.welcome p{font-size:.82rem;color:var(--txt2)}
.section-title{font-size:1.2rem;font-weight:700;color:var(--txt);margin-bottom:16px}
.subjects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.subject-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:10px}
.subject-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.sc-top{display:flex;align-items:center;justify-content:space-between}
.sc-icon{font-size:1.4rem}
.sc-weight{font-size:.68rem;background:var(--golddim);color:var(--gold);border:1px solid rgba(240,180,41,.2);padding:2px 7px;border-radius:12px}
.sc-name{font-size:.85rem;font-weight:600;color:var(--txt)}
.sc-count{font-size:.7rem;color:var(--txt3)}
.prog-bar{height:4px;background:var(--border2);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .4s ease}
.sc-stats{display:flex;gap:10px;font-size:.7rem;color:var(--txt3)}
.subj-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.subj-row:last-child{border-bottom:none}
.sr-icon{font-size:1rem;width:24px;text-align:center}
.sr-name{flex:1;font-size:.82rem;color:var(--txt)}
.sr-bar{width:90px;height:5px;background:var(--border2);border-radius:3px;overflow:hidden}
.sr-fill{height:100%;border-radius:3px;transition:width .4s}
.sr-pct{font-size:.73rem;font-family:'Courier New',monospace;min-width:34px;text-align:right}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.q-header{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.q-back{background:var(--surf2);border:1px solid var(--border2);color:var(--txt2);padding:6px 12px;border-radius:var(--rs);font-size:.78rem;transition:color .15s,border-color .15s}
.q-back:hover{color:var(--txt);border-color:var(--border)}
.q-tag{background:var(--golddim);border:1px solid rgba(240,180,41,.22);color:var(--gold);font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
.q-counter{margin-left:auto;font-size:.74rem;color:var(--txt3);font-family:'Courier New',monospace}
.q-box{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:14px}
.q-num{font-size:.7rem;color:var(--txt3);font-family:'Courier New',monospace;margin-bottom:8px}
.q-text{font-size:.93rem;line-height:1.7;color:var(--txt)}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.opt{background:var(--surf);border:1px solid var(--border);border-radius:var(--rs);padding:12px 15px;cursor:pointer;display:flex;align-items:flex-start;gap:11px;font-size:.86rem;line-height:1.5;color:var(--txt2);transition:border-color .12s,background .12s,color .12s}
.opt:hover:not(.dis){border-color:var(--border2);background:var(--surf2);color:var(--txt)}
.opt.sel{border-color:var(--gold);background:var(--golddim);color:var(--gold)}
.opt.ok{border-color:var(--green);background:var(--greendim);color:var(--green)}
.opt.bad{border-color:var(--red);background:var(--reddim);color:var(--red)}
.opt.dis{cursor:default}
.opt-l{width:22px;height:22px;border-radius:50%;background:var(--border2);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0;font-family:'Courier New',monospace}
.opt.sel .opt-l{background:var(--gold);color:#000}
.opt.ok .opt-l{background:var(--green);color:#000}
.opt.bad .opt-l{background:var(--red);color:#fff}
.expl{background:var(--bg3);border:1px solid var(--border2);border-left:3px solid var(--gold);border-radius:var(--rs);padding:14px 16px;margin-bottom:16px;font-size:.84rem;line-height:1.65;color:var(--txt2)}
.expl strong{display:block;color:var(--gold);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{padding:9px 18px;border-radius:var(--rs);font-size:.82rem;font-weight:600;border:none;transition:background .12s,transform .1s}
.btn:hover{transform:translateY(-1px)}
.btn-p{background:var(--gold);color:#000}
.btn-p:hover{background:var(--gold2)}
.btn-s{background:var(--surf2);color:var(--txt2);border:1px solid var(--border2)}
.btn-s:hover{color:var(--txt);border-color:var(--border)}
.exam-hdr{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer{font-family:'Courier New',monospace;font-size:1.3rem;font-weight:700;color:var(--gold);background:var(--golddim);padding:6px 14px;border-radius:var(--rs);min-width:80px;text-align:center}
.timer.warn{color:var(--red);background:var(--reddim)}
.exam-prog-wrap{flex:1;min-width:120px}
.exam-prog{height:6px;background:var(--border2);border-radius:3px;overflow:hidden;margin-top:4px}
.exam-prog-fill{height:100%;background:var(--gold);transition:width .3s}
.exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:4px;margin-bottom:18px}
.eg-btn{height:30px;border-radius:5px;border:1px solid var(--border2);background:var(--surf);color:var(--txt3);font-size:.7rem;transition:all .12s;font-family:'Courier New',monospace}
.eg-btn:hover{border-color:var(--gold);color:var(--gold)}
.eg-btn.ans{background:var(--golddim);border-color:rgba(240,180,41,.3);color:var(--gold)}
.eg-btn.cur{background:var(--gold);color:#000;border-color:var(--gold)}
.res-hero{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:36px;text-align:center;margin-bottom:20px}
.res-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--txt3)}
.res-score{font-size:4.5rem;font-weight:900;font-family:'Courier New',monospace;line-height:1;margin:10px 0}
.res-score.pass{color:var(--green)}
.res-score.fail{color:var(--red)}
#toast-box{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:7px;z-index:9999}
.toast{background:var(--surf);border:1px solid var(--border2);border-radius:var(--rs);padding:9px 15px;font-size:.81rem;color:var(--txt);box-shadow:0 4px 20px rgba(0,0,0,.5);animation:tin .18s ease forwards;max-width:260px}
.toast.ok{border-left:3px solid var(--green)}
.toast.err{border-left:3px solid var(--red)}
@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.empty{text-align:center;padding:44px 20px;color:var(--txt3);font-size:.86rem}
.empty .ei{font-size:2.4rem;margin-bottom:10px}
/* CONCEPTS PAGE */
.concept-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.cnav-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:none;color:var(--txt3);font-size:.75rem;transition:all .12s;cursor:pointer}
.cnav-btn:hover{border-color:var(--border);color:var(--txt2)}
.cnav-btn.on{background:var(--golddim);border-color:rgba(240,180,41,.3);color:var(--gold)}
.concept-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:18px}
.concept-title{font-size:1rem;font-weight:700;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.concept-body{font-size:.85rem;line-height:1.75;color:var(--txt2)}
.concept-body strong{color:var(--txt);font-weight:600}
.concept-body .formula{background:var(--bg3);border:1px solid var(--border2);border-left:3px solid var(--gold);border-radius:var(--rs);padding:12px 16px;margin:10px 0;font-family:'Courier New',monospace;font-size:.85rem;color:var(--gold2)}
.concept-body .example{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:12px 16px;margin:10px 0;font-size:.82rem;color:var(--txt2)}
.concept-body .example strong{color:var(--green);display:block;margin-bottom:4px}
.concept-body table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.82rem}
.concept-body table th{background:var(--surf2);color:var(--txt);padding:8px 12px;text-align:left;border:1px solid var(--border2)}
.concept-body table td{padding:7px 12px;border:1px solid var(--border2);color:var(--txt2)}
.concept-body table tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.tip-box{background:rgba(240,180,41,.07);border:1px solid rgba(240,180,41,.2);border-radius:var(--rs);padding:10px 14px;margin:10px 0;font-size:.82rem;color:var(--gold2)}
.tip-box::before{content:'💡 Exam Tip: ';font-weight:700}
@media(max-width:700px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0);box-shadow:4px 0 30px rgba(0,0,0,.6)}
  #wrap{margin-left:0}
  #menu-tog{display:block}
  #main{padding:16px}
  .two-col{grid-template-columns:1fr}
  .dash-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<aside id="sidebar">
  <div class="sb-logo"><h2>📚 CFA Level I</h2><small>Study Platform · 2026</small></div>
  <nav class="sb-nav">
    <div class="nav-section">Main</div>
    <div class="nav-item" data-v="dashboard"><span class="ni">🏠</span>Dashboard</div>
    <div class="nav-item" data-v="subjects"><span class="ni">📖</span>All Subjects</div>
    <div class="nav-item" data-v="concepts"><span class="ni">🧠</span>Concept Guide</div>
    <div class="nav-item" data-v="stats"><span class="ni">📊</span>My Statistics</div>
    <div class="nav-section" style="margin-top:10px">Subjects</div>
    <div class="nav-item" data-v="subject" data-s="ETHICS"><span class="ni">⚖️</span>Ethics</div>
    <div class="nav-item" data-v="subject" data-s="QUANT"><span class="ni">📐</span>Quantitative</div>
    <div class="nav-item" data-v="subject" data-s="ECONOMICS"><span class="ni">🌐</span>Economics</div>
    <div class="nav-item" data-v="subject" data-s="FSA"><span class="ni">📋</span>FSA</div>
    <div class="nav-item" data-v="subject" data-s="CORPORATE"><span class="ni">🏢</span>Corporate Issuers</div>
    <div class="nav-item" data-v="subject" data-s="EQUITY"><span class="ni">📈</span>Equity</div>
    <div class="nav-item" data-v="subject" data-s="FIXED_INCOME"><span class="ni">🏦</span>Fixed Income</div>
    <div class="nav-item" data-v="subject" data-s="DERIVATIVES"><span class="ni">🔄</span>Derivatives</div>
    <div class="nav-item" data-v="subject" data-s="ALT_INV"><span class="ni">💎</span>Alternative Inv.</div>
    <div class="nav-item" data-v="subject" data-s="PORTFOLIO"><span class="ni">🎯</span>Portfolio Mgmt</div>
  </nav>
  <div class="sb-foot"><button class="exam-btn" id="exam-cta">📝 Generate Mock Exam</button></div>
</aside>
<div id="wrap">
  <header class="topbar">
    <button id="menu-tog">☰</button>
    <span class="topbar-title">CFA · Study Platform 2026</span>
    <span class="streak" id="streak-el">🔥 0 day streak</span>
  </header>
  <main id="main"></main>
</div>
<div id="toast-box"></div>
<script>
var SUBS={
  ETHICS:{name:"Ethics & Standards",icon:"⚖️",weight:"15-20%",col:"#f0b429"},
  QUANT:{name:"Quantitative Methods",icon:"📐",weight:"8-12%",col:"#5fa0f5"},
  ECONOMICS:{name:"Economics",icon:"🌐",weight:"8-12%",col:"#a78bfa"},
  FSA:{name:"Financial Statement Analysis",icon:"📋",weight:"13-17%",col:"#fb923c"},
  CORPORATE:{name:"Corporate Issuers",icon:"🏢",weight:"8-12%",col:"#34d399"},
  EQUITY:{name:"Equity Investments",icon:"📈",weight:"10-12%",col:"#f472b6"},
  FIXED_INCOME:{name:"Fixed Income",icon:"🏦",weight:"10-12%",col:"#20d0a0"},
  DERIVATIVES:{name:"Derivatives",icon:"🔄",weight:"5-8%",col:"#f87171"},
  ALT_INV:{name:"Alternative Investments",icon:"💎",weight:"5-8%",col:"#818cf8"},
  PORTFOLIO:{name:"Portfolio Management",icon:"🎯",weight:"5-8%",col:"#fbbf24"}
};

var QS=[
{id:1,s:"ETHICS",q:"Under the CFA Institute Standards, a member managing portfolios for both employer and an outside client must most likely:",o:["Disclose all conflicts to all parties","Obtain written consent from all parties","Resign from one relationship","Notify only the employer"],c:0,e:"Standard VI(A) requires full disclosure of all matters that could impair independence to all affected parties."},
{id:2,s:"ETHICS",q:"An analyst receives gifts worth $300 from a company she covers at a conference. She should:",o:["Accept if customary in the industry","Decline or return gifts that could influence her judgment","Accept but increase sell recommendations","Disclose only in her personal file"],c:1,e:"Standard I(B) requires declining gifts that could compromise independence. Token gifts may be accepted with employer disclosure."},
{id:3,s:"ETHICS",q:"Material nonpublic information under Standard II(A) is best described as:",o:["Any undisclosed information","Information likely to affect a security's price if made public","Information known only to senior management","Information from an annual report before release"],c:1,e:"Both materiality (price impact) and nonpublic (not broadly disseminated) conditions must be met."},
{id:4,s:"ETHICS",q:"A portfolio manager front-runs client trades. This violates:",o:["Standard III(A) only","Standard VI(B) only","Both Standard III(A) and VI(B)","Standard II(B) only"],c:2,e:"Front-running violates VI(B) (client priority) and III(A) (loyalty to clients)."},
{id:5,s:"ETHICS",q:"A supervisor asks an analyst to change a sell recommendation to buy to maintain a banking relationship. The analyst should:",o:["Change as instructed","Refuse and document the refusal in writing","Change it but add a footnote","Resign immediately"],c:1,e:"Standards I(A) and IV(A) require maintaining professional integrity; refuse and document."},
{id:6,s:"ETHICS",q:"Under GIPS, which is most accurate regarding composite construction?",o:["Underperforming portfolios may be excluded retroactively","All fee-paying discretionary portfolios must be in at least one composite","Non-fee-paying portfolios are always excluded","Composites use market-value weighting at inception only"],c:1,e:"GIPS requires all actual, fee-paying, discretionary portfolios be included in at least one composite to prevent cherry-picking."},
{id:7,s:"ETHICS",q:"Which CFA designation presentation is acceptable?",o:["John Smith, CFA®","John Smith – CFA Charterholder, Level III","John Smith, cfa","John Smith, a Chartered Financial Analyst"],c:0,e:"The designation must follow the name. Lowercase and level designations are improper. Using the full phrase as a noun is improper."},
{id:8,s:"ETHICS",q:"Standard IV(C) requires a supervisor to:",o:["Personally review every subordinate trade","Take reasonable steps to detect and prevent violations","Be a CFA charterholder before supervising","Report violations to CFA Institute within 24 hours"],c:1,e:"Supervisors must establish and enforce adequate procedures to detect/prevent violations — not personally review every action."},
{id:9,s:"ETHICS",q:"Which CFA designation use is a violation? A charterholder states:",o:["I earned the CFA charter in 2020","CFA charterholders achieve superior results","I am a CFA charterholder","I hold the CFA designation"],c:1,e:"Standard VII(B) prohibits implying superior performance or competency from the designation."},
{id:10,s:"ETHICS",q:"Standard III(C) Suitability requires that before making recommendations, a member must:",o:["Ensure the recommendation fits the client's IPS and total portfolio","Always recommend the highest-returning investment","Consult at least two other analysts","Obtain compliance approval for every trade"],c:0,e:"Suitability requires evaluation in context of client's full portfolio and IPS."},
{id:11,s:"QUANT",q:"For lognormally distributed returns, which is most accurate regarding arithmetic vs. geometric mean?",o:["They are always equal","Arithmetic mean is greater than or equal to geometric mean","Geometric mean is greater than arithmetic mean","Their relationship depends only on sample size"],c:1,e:"By the AM-GM inequality, AM >= GM, with equality only when all values are identical. AM overstates compounded returns."},
{id:12,s:"QUANT",q:"A Type II error in hypothesis testing occurs when a researcher:",o:["Rejects a true null hypothesis","Fails to reject a false null hypothesis","Selects an incorrect significance level","Uses a one-tailed instead of two-tailed test"],c:1,e:"Type I = rejecting true null (false positive). Type II = failing to reject false null (false negative). P(Type II) = beta."},
{id:13,s:"QUANT",q:"Bayes' Theorem is best described as:",o:["P of two independent events occurring together","Updating prior probabilities based on new information","The unconditional probability of a joint event","The expected value of a discrete random variable"],c:1,e:"Bayes' Theorem: P(A|B) = P(B|A)*P(A)/P(B). Updates prior beliefs with new evidence."},
{id:14,s:"QUANT",q:"The coefficient of variation (CV) is best used to compare:",o:["Absolute risk of portfolios with the same mean","Relative risk of investments with different expected returns","Skewness of two return distributions","Correlation between two assets"],c:1,e:"CV = sigma/Mean. Measures risk per unit of return, enabling comparison across different return levels."},
{id:15,s:"QUANT",q:"A leptokurtic distribution, compared to the normal, has:",o:["Thinner tails and a flatter peak","Fatter tails and a higher, sharper peak","Skewness greater than 0","Kurtosis exactly equal to 3"],c:1,e:"Leptokurtic: excess kurtosis > 0 (kurtosis > 3) — fatter tails, higher peaks than normal."},
{id:16,s:"QUANT",q:"Multicollinearity in a multiple regression model most likely results in:",o:["Biased coefficients but correct standard errors","Correct coefficients but inflated standard errors","Both biased estimates and incorrect standard errors","No impact if R-squared is high enough"],c:1,e:"Multicollinearity does not bias coefficients but inflates standard errors, making t-statistics unreliable."},
{id:17,s:"QUANT",q:"In a two-tailed test at 5% significance, test statistic of 2.5 vs. critical value 1.96 leads to:",o:["Fail to reject the null hypothesis","Reject H0 — statistically significant at 5%","Reject H0 only for one-tailed test","Cannot conclude without sample size"],c:1,e:"|2.5| > 1.96 so test stat falls in the rejection region — Reject H0."},
{id:18,s:"QUANT",q:"Monte Carlo simulation is most appropriately used to:",o:["Derive exact closed-form option prices","Generate probability distributions by simulating random inputs","Replace historical simulation in all risk contexts","Eliminate model risk entirely"],c:1,e:"Monte Carlo generates many random scenarios from specified distributions to estimate outcome probability distributions."},
{id:19,s:"QUANT",q:"The geometric mean return is most useful for:",o:["Measuring average performance in a single period","Describing compounded multi-period investment growth","Comparing risk-adjusted returns across assets","Calculating expected value of a distribution"],c:1,e:"Geometric mean captures the actual compounded growth rate over multiple periods."},
{id:20,s:"QUANT",q:"Target downside deviation differs from standard deviation in that it:",o:["Uses only returns below a target threshold in the numerator","Measures dispersion above and below the mean equally","Uses n instead of n-1 in the denominator","Is always larger than standard deviation"],c:0,e:"Target downside deviation (semideviation) uses only observations below the target return in the calculation — (n-1) denominator."},
{id:21,s:"ECONOMICS",q:"If the price of a substitute good increases, what happens to demand for the original good?",o:["Shifts left (fewer buyers)","Shifts right (original good relatively cheaper)","Quantity demanded falls along the same curve","Remains unchanged"],c:1,e:"Higher price for substitute makes the original good more attractive, shifting its demand curve right."},
{id:22,s:"ECONOMICS",q:"Under MV=PQ, money supply grows 5%, real output grows 2%, velocity constant. Inflation is approximately:",o:["7%","3%","2.5%","10%"],c:1,e:"5% + 0% = %delta-P + 2% — Inflation approximately 3%. Monetarist view: inflation is a monetary phenomenon."},
{id:23,s:"ECONOMICS",q:"The J-curve effect describes:",o:["A trade deficit that worsens before improving after currency depreciation","Currency depreciation immediately improving the current account","Capital account surpluses automatically offsetting current account deficits","Permanent trade deterioration after devaluation"],c:0,e:"J-curve: trade balance initially worsens (price effects dominate before quantity adjusts) before improving."},
{id:24,s:"ECONOMICS",q:"A firm in a perfectly competitive market maximizes profit by producing where:",o:["ATC equals Price","MC equals Price","MR equals ATC","TR equals TC"],c:1,e:"Profit max: MR = MC. In perfect competition, Price = MR (price takers), so P = MC."},
{id:25,s:"ECONOMICS",q:"Under Mundell-Fleming with fixed exchange rates and high capital mobility:",o:["Monetary policy is effective; fiscal policy is not","Fiscal policy is effective; monetary policy is ineffective","Both policies are equally effective","Neither policy has any real effect"],c:1,e:"Fixed rates + high capital mobility: monetary policy is impotent (offset by exchange rate intervention); fiscal policy is highly effective."},
{id:26,s:"ECONOMICS",q:"A central bank raising its policy rate most likely causes:",o:["A steepening yield curve at all maturities","An appreciation of the domestic currency","Decreased demand for domestic assets","Reduced value of long-duration bonds only"],c:1,e:"Higher domestic rates attract foreign capital, increasing demand for the currency — it appreciates."},
{id:27,s:"ECONOMICS",q:"Which business cycle phase is associated with rising inflation, high capacity utilization, and falling unemployment?",o:["Trough","Contraction","Expansion/Peak","Recovery"],c:2,e:"During expansion/peak: unemployment falls, capacity is high, and inflationary pressures build."},
{id:28,s:"ECONOMICS",q:"The Fisher Effect states that:",o:["Nominal rate = Real rate + Expected inflation","Higher inflation always reduces real GDP","PPP holds in the short run","Real exchange rates are constant over time"],c:0,e:"Fisher Effect: Nominal approximately equals Real + Expected Inflation. International Fisher extends this to exchange rates."},
{id:29,s:"FSA",q:"Under IFRS, research costs are:",o:["Capitalized as intangible assets","Expensed as incurred; development costs may be capitalized if criteria are met","Always expensed regardless of future benefit","Treated identically to US GAAP in all cases"],c:1,e:"IAS 38: Research costs must be expensed. Development costs may be capitalized if specific criteria are met."},
{id:30,s:"FSA",q:"During rising prices, LIFO vs. FIFO results in:",o:["Higher net income and higher inventory","Lower net income, lower inventory, and higher COGS","Higher net income and lower COGS","Lower net income, higher inventory, and lower COGS"],c:1,e:"LIFO in rising prices: recent (higher-cost) items sold first — higher COGS, lower net income, lower ending inventory."},
{id:31,s:"FSA",q:"Revenue is recognized under IFRS 15 / ASC 606 when:",o:["Cash is received","The five-step model is satisfied and the performance obligation is met","An invoice is issued","The contract is signed"],c:1,e:"Revenue recognized when (or as) a performance obligation is satisfied — when control of goods or services transfers to the customer."},
{id:32,s:"FSA",q:"A company's total asset turnover fell while profit margin rose. Its ROE most likely:",o:["Definitely increased","Definitely decreased","Changed in an indeterminate direction","Remained unchanged"],c:2,e:"DuPont: ROE = Margin x Asset Turnover x Equity Multiplier. Opposing changes in margin and turnover make net ROE indeterminate."},
{id:33,s:"FSA",q:"Under IFRS 16, how does a lessee record a lease at inception?",o:["As an operating expense over the lease term","As a right-of-use asset and a lease liability on the balance sheet","Off-balance-sheet with no initial recognition","Only the first year's payment is recorded"],c:1,e:"IFRS 16 requires lessees to recognize a right-of-use (ROU) asset and a corresponding lease liability on the balance sheet."},
{id:34,s:"FSA",q:"When bonds are issued at a discount, the carrying value on the balance sheet:",o:["Remains constant at face value","Decreases over time","Increases over time as the discount is amortized","Decreases only if market rates rise further"],c:2,e:"Carrying value starts below face value and increases each period via the effective interest method, reaching face value at maturity."},
{id:35,s:"FSA",q:"Which transaction most likely increases the current ratio?",o:["Paying a current liability with cash","Using cash to buy long-term equipment","Issuing long-term debt to repay a current liability","Recording depreciation expense"],c:2,e:"Issuing long-term debt (non-current) to repay current liabilities reduces current liabilities without reducing current assets — current ratio increases."},
{id:36,s:"FSA",q:"Basic EPS is calculated as:",o:["Net income divided by weighted average diluted shares","(Net income minus Preferred dividends) divided by weighted average common shares","Net income divided by total shares outstanding at year end","EBIT divided by weighted average common shares"],c:1,e:"Basic EPS = (Net income - Preferred dividends) / Weighted average common shares outstanding during the period."},
{id:37,s:"CORPORATE",q:"A project has NPV = -$50k at 10% and NPV = +$30k at 6%. Its IRR is most likely:",o:["Less than 6%","Between 6% and 10%","Greater than 10%","Exactly 8%"],c:1,e:"IRR is where NPV = 0. Since NPV is positive at 6% and negative at 10%, the IRR lies between these two rates."},
{id:38,s:"CORPORATE",q:"The Modigliani-Miller theorem (no taxes) states that firm value:",o:["Increases as debt rises due to the tax shield","Is independent of capital structure","Decreases as financial leverage increases","Is maximized at 100% equity"],c:1,e:"M&M without taxes: firm value is independent of capital structure in perfect capital markets."},
{id:39,s:"CORPORATE",q:"Which is most likely a conflict between shareholders and bondholders?",o:["Managers investing in positive-NPV projects","Managers taking on excessively risky projects (asset substitution)","Paying dividends specified in covenants","Refinancing debt at lower rates"],c:1,e:"Asset substitution: shareholders favor riskier projects post-debt-issuance (unlimited upside, limited downside), transferring risk to bondholders."},
{id:40,s:"CORPORATE",q:"Under the pecking order theory, firms prefer financing using:",o:["Equity first, then debt, then retained earnings","Retained earnings first, then debt, then new equity","Debt first due to tax shield, then equity","New equity first to maintain optionality"],c:1,e:"Pecking order (Myers-Majluf): internal funds first, then debt, then new equity — because equity issuance signals negative information."},
{id:41,s:"CORPORATE",q:"WACC with D/E=0.5, cost of equity=12%, cost of debt=6%, tax rate=30% is closest to:",o:["9.0%","9.4%","10.0%","8.4%"],c:1,e:"D/V=1/3, E/V=2/3. WACC = (2/3)(12%) + (1/3)(6%)(0.70) = 8.0% + 1.4% = 9.4%."},
{id:42,s:"CORPORATE",q:"IRR assumes that interim cash flows from a project are reinvested at:",o:["The firm's WACC","The project's IRR itself","The risk-free rate","The cost of equity"],c:1,e:"IRR assumes reinvestment at the computed IRR; NPV assumes reinvestment at the required rate of return (often more realistic)."},
{id:43,s:"EQUITY",q:"A stock pays D0=$2, growing at 4% forever. Required return is 10%. Gordon Growth Model intrinsic value:",o:["$20.00","$33.33","$34.67","$50.00"],c:2,e:"V0 = D1/(r-g) = (2 x 1.04)/(0.10-0.04) = 2.08/0.06 = $34.67."},
{id:44,s:"EQUITY",q:"Price-to-book (P/B) ratio is least useful for valuing:",o:["Banks","Service companies with few tangible assets","Real estate investment trusts","Insurance companies"],c:1,e:"P/B is most useful for asset-intensive businesses. For service companies, intangible assets dominate and book value may understate economic value."},
{id:45,s:"EQUITY",q:"Enterprise Value (EV) differs from market capitalization because EV:",o:["Includes equity market value only","Adds debt and subtracts cash from market cap","Is always lower than market cap","Equals market cap times a price multiple"],c:1,e:"EV = Market Cap + Debt + Minority Interest + Preferred Stock - Cash. Represents total value available to all capital providers."},
{id:46,s:"EQUITY",q:"The justified P/E ratio is best described as:",o:["P/E derived from comparable company transactions","P/E implied by a fundamental valuation model such as DDM","Historical average P/E over 10 years","P/E using analyst consensus estimates"],c:1,e:"Justified P/E comes from fundamentals: using DDM gives P/E = payout ratio/(r-g). If market P/E > justified P/E, the stock is overvalued."},
{id:47,s:"EQUITY",q:"Top-down equity analysis proceeds in this order:",o:["Industry to Economy to Company","Company to Industry to Economy","Economy to Industry to Company","Economy to Company to Industry"],c:2,e:"Top-down analysis starts with macroeconomic analysis, then narrows to industry analysis, then individual company analysis."},
{id:48,s:"EQUITY",q:"The residual income model values a stock as book value per share plus:",o:["PV of all future dividends","PV of all future residual income (EPS minus required equity return times BV)","PV of all future free cash flows","Current P/B times future earnings growth"],c:1,e:"RI = Net Income - Equity Charge = EPS - (r x BVt-1). V0 = BV0 + PV(future RI). RI > 0 creates value above the required return."},
{id:49,s:"FIXED_INCOME",q:"A bond's modified duration is best described as:",o:["Time until the bond matures","Percentage price change for a 1% change in yield","Credit risk relative to Treasuries","Convexity of the price-yield relationship"],c:1,e:"Modified duration = -(1/P)(dP/dy). It measures the percentage price change per 1% change in the yield-to-maturity."},
{id:50,s:"FIXED_INCOME",q:"Which bond has the highest interest rate risk?",o:["10-year zero-coupon bond","10-year 8% coupon bond","5-year zero-coupon bond","5-year 8% coupon bond"],c:0,e:"Duration = maturity for zero-coupon bonds. A 10-year zero has duration = 10 years — the highest among these options."},
{id:51,s:"FIXED_INCOME",q:"The yield spread between a corporate bond and same-maturity Treasury compensates for:",o:["Interest rate risk only","Inflation risk only","Credit risk, liquidity risk, and other non-Treasury risks","Duration difference between the bonds"],c:2,e:"The spread compensates for credit risk (default/downgrade), liquidity risk, and other non-Treasury risks (tax, optionality, etc.)."},
{id:52,s:"FIXED_INCOME",q:"OAS (option-adjusted spread) differs from Z-spread in that OAS:",o:["Accounts for embedded options while Z-spread does not","Removes the option cost from the Z-spread","Uses a single yield while Z-spread uses spot rates","Equals Z-spread for all bonds"],c:1,e:"OAS = Z-spread minus option cost. For callable bonds, OAS < Z-spread because the call option benefits the issuer, not investors."},
{id:53,s:"FIXED_INCOME",q:"A bond with positive convexity:",o:["Falls more than duration predicts when yields rise","Benefits from large yield changes in either direction relative to duration estimate","Has a linear price-yield relationship","Exhibits this property only for zero-coupon bonds"],c:1,e:"Positive convexity: price rises more than duration predicts when yields fall, and falls less than duration predicts when yields rise."},
{id:54,s:"FIXED_INCOME",q:"Bootstrapping the spot rate curve involves:",o:["Estimating forward rates from survey data","Deriving zero-coupon rates from coupon bond prices sequentially","Fitting a polynomial to observed par yields","Averaging short-term rates to obtain long-term rates"],c:1,e:"Bootstrapping derives zero-coupon (spot) rates from coupon-paying bond prices, starting from shortest maturity and working forward."},
{id:55,s:"DERIVATIVES",q:"A European call option is in-the-money (ITM) when:",o:["Strike price is greater than current stock price","Current stock price is greater than strike price","Time to expiration is less than 3 months","Implied volatility is greater than historical volatility"],c:1,e:"Call ITM: S > K. At expiration, intrinsic value = max(S - K, 0)."},
{id:56,s:"DERIVATIVES",q:"Put-call parity for European options on non-dividend-paying stocks:",o:["C - P = S - PV(K)","C + P = S + PV(K)","C - P = PV(K) - S","C times P = S times PV(K)"],c:0,e:"Put-call parity: C - P = S0 - PV(K). Equivalently: C + PV(K) = P + S0. Violation implies an arbitrage opportunity."},
{id:57,s:"DERIVATIVES",q:"A long forward is equivalent to which option combination?",o:["Long call plus long put at same strike","Long call plus short put at same strike","Short call plus long put at same strike","Long stock plus long put"],c:1,e:"Synthetic long forward = long call + short put (same strike, same expiry). This follows from put-call parity rearrangement."},
{id:58,s:"DERIVATIVES",q:"An increase in the risk-free rate most likely increases the value of:",o:["Both calls and puts equally","Calls but decreases put values","Puts but decreases call values","Neither — rates only affect bond prices"],c:1,e:"Higher risk-free rates reduce PV(strike), benefiting calls (defer payment) and hurting puts. Per Black-Scholes: higher r -> higher call, lower put."},
{id:59,s:"DERIVATIVES",q:"A credit default swap (CDS) is best described as:",o:["An interest rate swap referencing a floating credit spread","A contract where buyer pays premiums for payment upon a credit event","An option to buy corporate bonds at a specified price","A forward contract on a reference entity's credit rating"],c:1,e:"In a CDS, protection buyer pays periodic spreads; if credit event (default, restructuring) occurs, seller pays par minus recovery value."},
{id:60,s:"DERIVATIVES",q:"Delta hedging a short call position requires the trader to:",o:["Buy the underlying asset","Sell the underlying asset","Hold a fixed number of shares regardless of price","Purchase put options"],c:0,e:"Short call has negative delta. To delta-hedge, buy the underlying in proportion to the option delta, creating a delta-neutral position."},
{id:61,s:"ALT_INV",q:"Relative to public equity, private equity investments are most likely characterized by:",o:["Greater liquidity and lower fees","Illiquidity, higher fees, and potentially higher returns","Similar regulatory oversight but less frequent valuations","Lower correlation due to daily mark-to-market pricing"],c:1,e:"PE is illiquid (long lock-ups), has high fees (typically 2/20), potentially higher returns as illiquidity premium, infrequent valuations."},
{id:62,s:"ALT_INV",q:"A PE fund uses 70% debt to acquire a company. This is best described as:",o:["Venture capital investment","Leveraged buyout (LBO)","Growth equity transaction","Secondary buyout structure"],c:1,e:"An LBO uses significant debt (often 60-80%) to acquire a company, with the target's assets or cash flows as collateral."},
{id:63,s:"ALT_INV",q:"A hedge fund earns 15% gross on $100M AUM with 2/20 fee structure. Net return to investors is closest to:",o:["15.0%","10.0%","12.0%","13.0%"],c:1,e:"Mgmt fee: 2% x $100M = $2M. Incentive fee: 20% x $15M = $3M. Net return = (15-2-3)/100 = 10.0%."},
{id:64,s:"ALT_INV",q:"Commodity total return is best described as the sum of:",o:["Dividend yield plus capital appreciation","Spot return plus roll yield plus collateral yield","Earnings yield plus price appreciation","Interest income plus currency appreciation"],c:1,e:"Commodity total return = Spot price return + Roll yield (from rolling futures) + Collateral yield (return on posted margin)."},
{id:65,s:"ALT_INV",q:"A clawback provision in private equity most likely reflects:",o:["Protection against paying twice for same performance","The right of LPs to reclaim part of GP's performance fee","A minimum return the GP must exceed to earn performance fees","The right to terminate the GP after underperformance"],c:1,e:"Clawback provisions allow LPs to reclaim prior incentive fee payments if GP exits successful early deals but incurs losses later."},
{id:66,s:"PORTFOLIO",q:"According to CAPM, expected return depends only on:",o:["Total risk (sigma) and the risk-free rate","Systematic risk (beta) and the market risk premium","Idiosyncratic risk and the market Sharpe ratio","Correlation with all other securities"],c:1,e:"CAPM: E(Ri) = Rf + beta_i x [E(Rm) - Rf]. Only systematic risk is rewarded; idiosyncratic risk can be diversified away."},
{id:67,s:"PORTFOLIO",q:"Adding a security reduces portfolio risk if its correlation with the portfolio is:",o:["Equal to +1.0","Less than +1.0","Greater than 0","Less than -1.0"],c:1,e:"Any asset with rho < +1.0 with the portfolio provides some diversification benefit. Only perfect correlation (rho=+1) provides no benefit."},
{id:68,s:"PORTFOLIO",q:"An Investment Policy Statement (IPS) most likely includes:",o:["Specific securities to buy and sell","Risk/return objectives, constraints, and implementation guidelines","Portfolio manager compensation structure","Names of all approved counterparties"],c:1,e:"IPS documents investor objectives (risk, return) and constraints (liquidity, time horizon, tax, legal, unique — RRTTLLU)."},
{id:69,s:"PORTFOLIO",q:"The Sharpe ratio measures:",o:["Excess return per unit of total risk (standard deviation)","Excess return per unit of systematic risk (beta)","Total return divided by market return","Portfolio variance divided by benchmark variance"],c:0,e:"Sharpe = (Rp - Rf)/sigma_p. Uses total risk (standard deviation). Treynor ratio uses beta instead."},
{id:70,s:"PORTFOLIO",q:"The efficient frontier is best described as:",o:["All possible portfolios from available assets","Portfolios maximizing return for each risk level or minimizing risk for each return level","The single portfolio with the highest Sharpe ratio","The line connecting the risk-free asset to the minimum-variance portfolio"],c:1,e:"The efficient frontier is the upper-left boundary: max return for given risk, or min risk for given return. Rational investors hold only these portfolios."},
{id:71,s:"PORTFOLIO",q:"Jensen&#39;s alpha measures:",o:["Excess return per unit of total risk","Excess return per unit of beta risk","Portfolio return minus CAPM-predicted return","Portfolio return minus the risk-free rate"],c:2,e:"Jensen&#39;s alpha = Rp - [Rf + beta(Rm-Rf)]. Positive alpha indicates outperformance relative to what CAPM predicts for that level of systematic risk."},
{id:72,s:"PORTFOLIO",q:"The CML differs from the SML in that the CML:",o:["Uses beta as the risk measure","Applies to individual securities and portfolios","Uses standard deviation and applies only to efficient portfolios","Is derived without assuming a risk-free asset"],c:2,e:"CML: uses sigma, applies only to efficient portfolios on the efficient frontier. SML: uses beta, applies to any individual security or portfolio."},
{id:73,s:"FSA",q:"An analyst concerned about the liquidity of a company's inventory will most likely look in the notes to determine the:",o:["Cost formula or inventory valuation method used","Amount of inventory expensed during the period","Breakdown of inventory between work in progress and finished goods","Average age of inventory"],c:2,e:"Finished goods are ready to ship and thus more liquid than work in progress — breakdown provides direct liquidity information."},
{id:74,s:"FSA",q:"A company that acquires a patent through external purchase rather than developing it internally is most likely to report:",o:["Lower amounts of assets","Higher investing cash outflows","Higher operating cash outflows","No difference in total cash flows"],c:1,e:"Cost of acquiring intangible assets is classified as investing cash outflows; developing internally is classified as operating cash outflows."},
{id:75,s:"CORPORATE",q:"In capital allocation, companies should:",o:["Assume no new competition in the marketplace","Incorporate sunk costs in the investment analysis","Ignore the impact of an investment on short-term accounting numbers","Use accounting income rather than incremental cash flows"],c:2,e:"NPV (using incremental cash flows) should be used to evaluate projects. Paying too much attention to short-run accounting numbers like EPS can lead to poor decisions."},
{id:76,s:"CORPORATE",q:"Ensuring the composition of a board of directors is aligned with governance principles is most likely a responsibility of the:",o:["Risk committee","Audit committee","Nominating committee","Compensation committee"],c:2,e:"The nominating committee ensures the board's composition is well balanced and aligned with the company's governance principles."},
{id:77,s:"QUANT",q:"The functional form most appropriate to test relationships between relative changes in both dependent and independent variables is:",o:["The lin-log model","The log-lin model","The log-log model","The lin-lin model"],c:2,e:"The log-log model (double-log): slope coefficient = relative change in Y for relative change in X — useful for calculating elasticities."},
{id:78,s:"FSA",q:"A significant increase in which ratio most likely indicates strengthened solvency?",o:["D/E ratio","Debt-to-EBITDA ratio","Fixed charge coverage ratio","Current ratio"],c:2,e:"Higher fixed charge coverage ratio = (EBIT + Lease payments)/(Interest + Lease payments) implies stronger ability to service debt."},
{id:79,s:"QUANT",q:"An investor receives $50,000 at end of Year 10. Discount rate is 5%. PV at end of Year 5 is closest to:",o:["$30,696","$37,311","$39,176","$41,160"],c:2,e:"Year 10 is 5 years into the future from end of Year 5. PV = $50,000 x (1.05)^-5 = $39,176."},
{id:80,s:"FSA",q:"A company acquires 100% of a target for $4.5M when net identifiable assets have FV of $5M. The acquirer reports:",o:["Goodwill of $0.5 million","A pretax gain of $0.5 million in profit and loss","A pretax gain of $0.5 million in OCI","An intangible asset of $0.5 million"],c:1,e:"When FV of assets exceeds purchase price (bargain purchase), the gain is recognized in P&L in the period it arises."},
{id:81,s:"FSA",q:"Net income=$108M, Depreciation=$20M, Interest=$20M, Working capital increase=$35M, Capex=$50M, Net borrowing=$14M, Tax=30%. FCFF vs FCFE:",o:["FCFF is less than FCFE","FCFF equals FCFE","FCFF is greater than FCFE","Cannot be determined"],c:1,e:"FCFF = 108+20+20(0.7)-35-50 = 57. FCFE = 108+20-35-50+14 = 57. They are equal when interest(1-t) = net borrowing."},
{id:82,s:"QUANT",q:"A fund has $50M AUM earning 17% in Year 1, receives $125M additional at start of Year 2, earns 12% in Year 2. Money-weighted return is closest to:",o:["13.2%","14.5%","15.5%","12.0%"],c:0,e:"FV = 50(1.17)(1.12) + 125(1.12) = 205.52. CF0=-50, CF1=-125, CF2=+205.52, IRR approximately 13.2%."},
{id:83,s:"CORPORATE",q:"Which most accurately describes the IRR method?",o:["Is sensitive to changes in WACC","Is the preferred method for evaluating mutually exclusive projects","Assumes cash flows reinvested at the computed IRR","Always gives the same ranking as NPV"],c:2,e:"IRR assumes interim cash flows reinvested at the IRR. NPV assumes reinvestment at r (more economically realistic)."},
{id:84,s:"QUANT",q:"WACC: 40% debt at 8%, 50% equity at 16%, 10% preferred at 10%, marginal tax=25%. WACC is closest to:",o:["11.2%","11.4%","12.2%","10.8%"],c:1,e:"WACC = 0.4 x 0.08 x (1-0.25) + 0.1 x 0.1 + 0.5 x 0.16 = 0.024 + 0.01 + 0.08 = 11.4%."},
{id:85,s:"ECONOMICS",q:"Which fiscal policy tool is an automatic stabilizer?",o:["Capital expenditures","Social benefits through transfer payments","Current government spending on goods and services","Central bank policy rate changes"],c:1,e:"Automatic stabilizers like unemployment benefits automatically rise when output falls, providing fiscal stimulus without requiring policy action."},
{id:86,s:"FSA",q:"DuPont analysis: Tax burden=0.4, Pretax margin=10%, Total asset turnover=1.5, Financial leverage=1.2. ROE is:",o:["5.4%","6.0%","7.2%","8.0%"],c:2,e:"ROE = Tax Burden x Pretax Margin x Total Asset Turnover x Leverage = 0.4 x 10% x 1.5 x 1.2 = 7.2%."},
{id:87,s:"ECONOMICS",q:"Which monetary policy regime most likely imports the inflation of a foreign economy?",o:["Inflation targeting","Interest rate targeting","Exchange rate targeting","Monetary aggregate targeting"],c:2,e:"Exchange rate targeting ties domestic currency to a low-inflation economy, effectively importing that economy's inflation experience."},
{id:88,s:"ECONOMICS",q:"One of the key roles played by central banks is:",o:["Regulating the payments system","Controlling aggregate demand with tax rates","Allocating resources between sectors","Setting fiscal policy"],c:0,e:"Central banks regulate and supervise the payments system, in addition to being monopoly supplier of currency and lender of last resort."},
{id:89,s:"FSA",q:"Under US GAAP, for a long-term operating lease, the lessee reports after inception:",o:["The lease payment split between financing and operating outflows","At inception, a ROU asset and liability at undiscounted value","A single lease expense each year, straight-line over the lease term","No balance sheet impact under the operating lease model"],c:2,e:"Under US GAAP operating lease: total expense = lease payment (interest plus ROU amortization equals the constant lease payment)."},
{id:90,s:"ECONOMICS",q:"Which market structure best describes many firms supplying differentiated products?",o:["An oligopoly","Perfect competition","Monopolistic competition","Monopoly"],c:2,e:"Monopolistic competition: many firms providing differentiated products, relatively low barriers to entry, some pricing power."},
{id:91,s:"QUANT",q:"Quarterly returns: Q1=2%, Q2=6%, Q3=-4%, Q4=8%. Target=5%. Target downside deviation (n-1 denominator) is closest to:",o:["4.7%","5.3%","5.5%","6.0%"],c:2,e:"Only Q1(2%) and Q3(-4%) are below target 5%. [(2-5)^2 + (-4-5)^2]/(4-1) = 90/3 = 30. Square root of 30 approximately 5.5%."},
{id:92,s:"QUANT",q:"Sampling error is best described as:",o:["Variance of a random variable","Difference between observed statistic and the quantity it estimates from population subsets","Standard deviation of the sampling distribution","Bias introduced by non-random sample selection"],c:1,e:"Sampling error = difference between the observed value of a statistic and the quantity it estimates, resulting from using subsets of the population."},
{id:93,s:"QUANT",q:"Neural networks using many hidden layers for multistage, non-linear data processing best describes:",o:["Deep learning","Supervised learning","Unsupervised learning","Reinforcement learning"],c:0,e:"Deep learning uses neural networks with many hidden layers to perform multistage, non-linear pattern identification in data."},
{id:94,s:"FSA",q:"Which most likely increases a manufacturing company's operating income? A decrease in:",o:["Income taxes","Interest charges","Administrative costs","Depreciation"],c:2,e:"Operating profit = gross profit minus operating costs. A decrease in administrative costs (an operating cost) increases operating income."},
{id:95,s:"QUANT",q:"For a contingency table with r rows and c columns, degrees of freedom for independence test are:",o:["rc","rc minus 1","(r minus 1)(c minus 1)","(r minus 1)(c minus 2)"],c:2,e:"Chi-square test for independence: df = (r-1)(c-1), where r and c are the numbers of categories for each variable."},
{id:96,s:"QUANT",q:"An annuity pays 10,000 euros per year for 5 years, first payment 2 years from today. Discount rate=4%. PV today is closest to:",o:["41,160 euros","42,806 euros","44,518 euros","43,295 euros"],c:1,e:"PV at t=1: PMT=10000, N=5, I=4% yields 44,518.22 euros. PV at t=0: 44,518.22/1.04 approximately 42,806 euros."},
{id:97,s:"FSA",q:"An intangible asset with an indefinite useful life is:",o:["Not subjected to impairment testing","Tested at least annually for impairment","Amortized over 40 years","Only tested for impairment when there is an indication"],c:1,e:"Indefinite-life intangibles are not amortized. Instead, they are tested for impairment at least annually."},
{id:98,s:"QUANT",q:"For two positive numbers, which relationship must always hold?",o:["AM squared = HM times GM","GM squared = AM times HM","HM squared = GM times AM","AM equals GM equals HM"],c:1,e:"AM times HM = GM squared. For a=1, b=9: AM=5, HM=1.8, GM=3. GM^2 = 9 = AM x HM = 5 x 1.8 = 9. Verified."},
{id:99,s:"QUANT",q:"Discrete RV X: P(X=0)=0.5, P(X=1)=0.5. Variance of X is closest to:",o:["0.25","0.50","1.00","0.75"],c:0,e:"E(X) = 0.5. Var(X) = 0.5 x (0-0.5)^2 + 0.5 x (1-0.5)^2 = 0.5 x 0.25 + 0.5 x 0.25 = 0.25."},
{id:100,s:"ECONOMICS",q:"CAD/EUR=1.0718, EUR/GBP=0.9463. GBP/CAD cross-rate is closest to:",o:["0.8829","0.9860","1.0142","1.1340"],c:1,e:"GBP/CAD = (CAD/EUR)^-1 x (EUR/GBP)^-1 = (1/1.0718) x (1/0.9463) approximately 0.9860."},
{id:101,s:"ECONOMICS",q:"An oligopoly is characterized by:",o:["Many sellers and homogeneous products","High barriers to entry and products with close substitutes within the market","Low barriers to entry and many firms","A single seller with no substitutes"],c:1,e:"Oligopoly: high barriers, few sellers, products are close substitutes within the market, significant product differentiation via marketing."},
{id:102,s:"ECONOMICS",q:"If average weekly hours in manufacturing decrease and unit labor costs remain the same, this most likely indicates future economic:",o:["Decline","Stability","Growth","Inflation"],c:0,e:"Average weekly hours is a leading indicator — decrease suggests economic decline. Stable unit labor costs (lagging) add no positive signal."},
{id:103,s:"FSA",q:"Which most likely provides an opportunity for low-quality financial reports?",o:["Ineffective board of directors","Concern about future career opportunities","Incentive compensation based on earnings","Regulatory pressure to restate"],c:0,e:"Low-quality reporting requires opportunity, motivation, and rationalization. Ineffective boards provide opportunity (weak internal controls)."},
{id:104,s:"ECONOMICS",q:"For a non-colluding oligopoly with a price leader, the optimal market price is determined by the:",o:["Dominant firm's demand schedule","Market's aggregate demand curve","Market's MR = MC intersection","Followers' combined supply curve"],c:0,e:"The dominant firm sets price where its MR = MC on its portion of the demand curve — not on the aggregate market demand curve."},
{id:105,s:"ECONOMICS",q:"CHF/USD spot=1.0072, 270-day CHF rate=0.63%, USD rate=0.75%. Forward points for 270-day CHF/USD are closest to:",o:["-12.0 points","-9.0 points","0.5 points","9.0 points"],c:1,e:"F = 1.0072 x [1+(0.0063 x 270/360)] / [1+(0.0075 x 270/360)] = 1.0063. Points = (1.0063-1.0072) x 10,000 approximately -9 points."},
{id:106,s:"CORPORATE",q:"Which board member is most likely considered independent?",o:["Former chief executive officer of the corporation","University professor who is also a consultant to the corporation","Current senior executive from a corporation in a different industry","A director who owns 15% of the company"],c:2,e:"An independent director has no material relationship with the company regarding employment, ownership, or remuneration."},
{id:107,s:"CORPORATE",q:"Suppliers to a company are most likely to have the greatest concern about:",o:["The company's long-term growth prospects","The company's cash flow generation","The company's market share","The company's R&D spending"],c:1,e:"Suppliers are short-term creditors primarily interested in being paid timely for products/services delivered — they focus on cash flow generation."},
{id:108,s:"FSA",q:"An increase in the inventory valuation allowance account most likely increases the:",o:["Interest coverage ratio","Working capital turnover ratio","Days of inventory on hand ratio","Gross profit margin"],c:1,e:"Revenue is unaffected by the write-down; inventory (working capital denominator) decreases — Working capital turnover = Revenue/Avg WC increases."},
{id:109,s:"FSA",q:"Under the revaluation model, an initial upward revaluation most likely results in a:",o:["Higher net profit margin","Lower financial leverage ratio","Higher total asset turnover ratio","No effect on equity"],c:1,e:"Upward revaluation increases assets and equity by same amount. When leverage ratio > 1, adding same amount to both numerator and denominator reduces the ratio."},
{id:110,s:"FSA",q:"Under indirect method, US GAAP: Revenue=$359M, Net income=$35M, Income tax payable decrease=$16M, Interest payable increase=$22M. Cash operating expenses are closest to:",o:["$318M","$330M","$353M","$302M"],c:0,e:"Total expenses = 359-35 = $324M. Cash op. expenses = 324 + 16 (tax payable decrease) - 22 (interest payable increase) = $318M."},
{id:111,s:"QUANT",q:"When estimating average return over multiple consecutive periods, it is most appropriate to use the:",o:["Harmonic mean","Arithmetic mean","Geometric mean","Mode"],c:2,e:"Geometric mean captures how total returns are linked over time — it is the compounded growth rate over multiple periods."},
{id:112,s:"CORPORATE",q:"Under MM without corporate taxes, if a company's D/E ratio increases, its cost of equity:",o:["Decreases","Remains unchanged","Increases","Decreases then increases"],c:2,e:"MM Proposition II without taxes: as leverage increases, equity risk increases, so cost of equity increases to keep WACC constant."},
{id:113,s:"ECONOMICS",q:"USD/EUR changes from 1.1000 to 1.2000. This implies that the US dollar has:",o:["Depreciated against the euro by 8.33%","Appreciated against the euro by 8.33%","Appreciated against the euro by 9.09%","Depreciated against the euro by 9.09%"],c:0,e:"EUR/USD changed from 1/1.1=0.9091 to 1/1.2=0.8333. % change in USD = (0.8333-0.9091)/0.9091 = -8.33% (depreciation)."},
{id:114,s:"PORTFOLIO",q:"The tendency to classify information based on past experiences and known classifications best defines:",o:["Confirmation bias","Conservatism bias","Representativeness bias","Hindsight bias"],c:2,e:"Representativeness bias: classifying new information based on past experiences or known patterns, even when data doesn't support it."},
{id:115,s:"PORTFOLIO",q:"Which is most likely a benefit of globalization?",o:["Increased profits through access to new markets","Economic interdependence risks","Stronger environmental standards universally","Reduced currency volatility"],c:0,e:"Globalization may generate higher profits by accessing new customers and reducing costs through lower-cost environments."},
{id:116,s:"FSA",q:"Working capital=$60M, Non-current assets=$235M, Equity=$170M, Current ratio=1.75. Financial leverage is closest to:",o:["1.2","1.7","2.2","3.0"],c:2,e:"CR=1.75: CA=140, CL=80. Total assets=140+235=$375M. Financial leverage = Total assets/Equity = 375/170 = 2.2."},
{id:117,s:"ECONOMICS",q:"The money supply most likely increases when a central bank:",o:["Purchases bonds","Increases the policy rate","Raises the reserve requirement","Issues new government debt"],c:0,e:"When the central bank buys bonds from banks (repo), it injects reserves into the banking system, increasing the money supply."},
{id:118,s:"FSA",q:"Taxes payable are calculated based on:",o:["EBIT","Taxable income","Accounting profit","Operating cash flow"],c:1,e:"Taxable income is the basis for income tax payable (balance sheet liability). Accounting profit is the basis for income tax expense on the income statement."},
{id:119,s:"FSA",q:"Net income=$3.1M, Common dividends=$775K, Preferred dividends=$500K, Shares=1M on Jan 1. 2-for-1 split on July 1. Basic EPS is closest to:",o:["$0.91","$1.30","$1.73","$2.60"],c:1,e:"Stock splits are retroactive from start of period. Adjusted shares = 2M. Basic EPS = (3.1M - 0.5M)/2M = $1.30."},
{id:120,s:"FSA",q:"Inherent risks in an investment are most appropriately evaluated in which step of financial statement analysis?",o:["Process data","Articulate the purpose and context of analysis","Develop and communicate conclusions and recommendations","Collect data"],c:2,e:"Presentation and evaluation of inherent risks is appropriate in the develop and communicate conclusions/recommendations step."},
{id:121,s:"FSA",q:"Under IFRS 15, 4-year construction contract: total sales=5,000 pounds, total costs=4,000 pounds, Year 1 costs=1,200 pounds. Year 1 revenue recognized is closest to:",o:["300 pounds","1,000 pounds","1,500 pounds","1,200 pounds"],c:2,e:"% complete = 1,200/4,000 = 30%. Revenue recognized = 30% x 5,000 = 1,500 pounds."},
{id:122,s:"PORTFOLIO",q:"If the threshold return is greater than the risk-free rate, the portfolio's safety-first ratio is:",o:["Less than its Sharpe ratio","Equal to its Sharpe ratio","Greater than its Sharpe ratio","Unrelated to the Sharpe ratio"],c:0,e:"SFRatio = [E(Rp) - RL]/sigma_p. If RL > RF, then E(Rp)-RL < E(Rp)-RF, so SFRatio < Sharpe ratio."},
{id:123,s:"PORTFOLIO",q:"WACC: 30% debt at 4%, 70% equity at 8%, marginal tax=25%. WACC is:",o:["5.9%","6.5%","6.8%","7.2%"],c:1,e:"WACC = 0.30 x 0.04 x (1-0.25) + 0.70 x 0.08 = 0.009 + 0.056 = 6.5%."},
{id:124,s:"QUANT",q:"The standard error of the slope coefficient in simple regression equals the standard error of estimate divided by the square root of:",o:["Sum of squares regression","Standard error of the forecast","Variation of the independent variable","Sample size"],c:2,e:"s_b1 = s_e / square root of [sum of (Xi - X-bar)^2]. Standard error of slope = se / square root of variation of independent variable."},
{id:125,s:"CORPORATE",q:"Which is most likely a primary source of liquidity?",o:["Regular credit lines","Sale of operating assets","Renegotiation of supplier contracts","Asset securitization"],c:0,e:"Primary sources of liquidity include short-term funds like trade credit, bank lines of credit, and short-term investment portfolios — using them does not affect normal operations."},
{id:126,s:"PORTFOLIO",q:"Using market levels as signals to measure likelihood of geopolitical risk best describes:",o:["Signposting","Scenario analysis","Geopolitical risk translation","Black swan analysis"],c:0,e:"A signpost is an indicator, market level, data piece, or event that signals a geopolitical risk is becoming more or less likely to materialize."},
{id:127,s:"CORPORATE",q:"According to pecking order theory, managers prefer:",o:["Public debt over private debt","Public equity over public debt","Internal financing over private debt","Convertible bonds over straight debt"],c:2,e:"Pecking order: internal financing first, then private debt, then public debt, then equity (least preferred due to information asymmetry signaling)."},
{id:128,s:"FSA",q:"Company collected from customers: Revenue=$54.4M, AR decreased from $28.6M to $20.5M. Cash collected is closest to:",o:["$25.9M","$46.3M","$62.5M","$54.4M"],c:2,e:"Cash collected = Revenue + Decrease in AR = 54.4 + (28.6 - 20.5) = 54.4 + 8.1 = $62.5M."},
{id:129,s:"FSA",q:"The correction of a material prior-period error is handled by:",o:["Adding a note disclosure only","Restating prior periods only","Both adding a note disclosure and restating prior periods","Adjusting current period income statement only"],c:2,e:"Material prior-period errors require both: restating prior period financial statements AND adding note disclosures (IAS 8 and FASB ASC 250)."},
{id:130,s:"CORPORATE",q:"In which life cycle stage is a company most likely first offered secured borrowing?",o:["Mature","Growth","Start-up","Decline"],c:1,e:"During growth stage, the company develops assets (receivables, inventory, fixed assets) that can be used to secure debt financing."},
{id:131,s:"ECONOMICS",q:"Substantial government borrowing is less likely to be of concern when:",o:["Private sector decreases savings to offset debt","Most borrowing is owed internally to local citizens","Private sector is crowded out","Inflation is low"],c:1,e:"When debt is owed internally to fellow citizens, the concern about government borrowing is overstated — it does not represent a net drain on national wealth."},
{id:132,s:"CORPORATE",q:"A process to take a private company public without an underwriter is a:",o:["Traditional IPO","Direct listing","Acquisition by a SPAC","Secondary offering"],c:1,e:"A direct listing (DL) does not involve an underwriter and no new capital is raised; existing shareholders sell shares directly on an exchange."},
{id:133,s:"QUANT",q:"A test statistic is used to:",o:["Make a statistical decision","Estimate a population parameter","Calculate the level of significance","Determine appropriate sample size"],c:0,e:"A test statistic is a quantity calculated from a sample whose value is the basis for deciding whether or not to reject the null hypothesis."},
{id:134,s:"FSA",q:"Which ratio will most likely increase as a result of an inventory write-down?",o:["Gross profit margin","Total asset turnover","Days of inventory on hand","Quick ratio"],c:1,e:"Total asset turnover = Revenue/Total assets. Revenue is unaffected; total assets decrease as inventory is reduced — ratio increases."},
{id:135,s:"CORPORATE",q:"Which best describes business growth where more customers attract more merchants, contributing to further growth?",o:["Crowdsourcing","A one-sided network","A multi-sided network","Vertical integration"],c:2,e:"Multi-sided (two-sided) networks: more users attract more merchants, which attract more users — these businesses can grow exponentially."},
{id:136,s:"EQUITY",q:"Which industry classification scheme covers private companies, non-profits, and government entities?",o:["The Industry Classification Benchmark (ICB)","The Refinitiv Business Classification (TRBC)","The Global Industry Classification Standard (GICS)","The SIC system"],c:1,e:"GICS and ICB cover public companies; TRBC also covers private companies, non-profits, and government entities."},
{id:137,s:"PORTFOLIO",q:"Which IPS section most likely explains steps to keep the IPS current?",o:["Procedures","Investment Guidelines","Statement of Duties and Responsibilities","Risk Objectives"],c:0,e:"The Procedures section explains steps to keep the IPS current and procedures to follow in response to various contingencies."},
{id:138,s:"DERIVATIVES",q:"A swap is most likely similar to a series of forward contracts when:",o:["All forward contracts have the same maturity","The combined value of all forward contracts is zero","The long forward values match short forward values at each payment date","All forwards are in-the-money"],c:1,e:"Each forward is created at the fixed price corresponding to the swap; some have positive and some negative values, but their combined values equal zero."},
{id:139,s:"PORTFOLIO",q:"The CAPM expected return is least likely used for:",o:["Setting fair insurance premiums","Determining economic feasibility of projects","Forecasting the IRR of a project","Calculating cost of capital for regulated companies"],c:2,e:"CAPM expected return is used as a hurdle rate/cost of capital for discounting cash flows — not for forecasting the project's IRR (which is calculated from cash flows)."},
{id:140,s:"ALT_INV",q:"Which is considered an economic infrastructure asset?",o:["Health care assets","Educational assets","Information and communication technology assets","Social housing assets"],c:2,e:"Economic infrastructure supports economic activity: transportation, ICT (telecom towers, data centers), utility/energy assets. Social infrastructure includes healthcare, education."},
{id:141,s:"DERIVATIVES",q:"A hedge portfolio of underlying assets and derivatives, absent arbitrage, is expected to earn:",o:["Zero return","The risk-free rate of return","The weighted average return of underlying assets","The market risk premium"],c:1,e:"A hedge portfolio eliminates risk; in the absence of arbitrage, a risk-free portfolio should earn the risk-free rate."},
{id:142,s:"EQUITY",q:"Non-callable, non-convertible preferred stock pays $3.75 annual dividend, sells at $50 par. If required return increases 75 bps, new price is closest to:",o:["$45.45","$49.50","$55.56","$43.21"],c:0,e:"Current required return = 3.75/50 = 7.50%. New required return = 8.25%. New price = 3.75/0.0825 = $45.45."},
{id:143,s:"PORTFOLIO",q:"Which statement about pension plans is most accurate?",o:["Defined benefit plans typically have a low risk tolerance","Defined contribution plans typically have a high risk tolerance","The sponsor of a DB plan specifies the obligation owed to participants","Individual DB plan participants bear the investment risk"],c:2,e:"In a DB plan, the sponsor specifies and guarantees the retirement income obligation (defined benefit) owed to participants."},
{id:144,s:"EQUITY",q:"Short positions have the potential for:",o:["Unbounded gains only","Unbounded losses only","Both unbounded gains and unbounded losses","Neither unbounded gains nor losses"],c:1,e:"Short positions: gains limited to 100% (stock can only go to zero); losses are theoretically unbounded (stock price can rise without limit)."},
{id:145,s:"EQUITY",q:"D0=$10, beta=1.4, Rf=3%, Rm=9%, dividend growth=2%. Gordon Growth Model intrinsic value is closest to:",o:["$106.38","$108.51","$145.71","$88.50"],c:1,e:"r = 3% + 1.4 x (9%-3%) = 11.4%. V0 = D1/(r-g) = 10 x 1.02/(0.114-0.02) = 10.2/0.094 approximately $108.51."},
{id:146,s:"PORTFOLIO",q:"For an equally weighted portfolio of 500 assets with average variance=0.04 and average covariance=0.01, portfolio variance is closest to:",o:["0.01","0.04","0.05","0.02"],c:0,e:"Portfolio variance approximately (0.04/500) + (499/500) x 0.01 approximately 0.01. For large portfolios, covariance dominates."},
{id:147,s:"PORTFOLIO",q:"Liquidity risk is best described as the risk of:",o:["Running out of cash to meet obligations","A significant downward valuation adjustment when selling an asset","Counterparty defaulting on settlement","Interest rate changes affecting bond prices"],c:1,e:"Liquidity risk: risk of a significant price concession when selling a financial asset to find a willing buyer."},
{id:148,s:"PORTFOLIO",q:"A client has high income and successful business, but strongly agrees she is more comfortable with bank deposits than stocks. Her risk profile is:",o:["Low ability and high willingness","High ability and high willingness","High ability and low willingness","Low ability and low willingness"],c:2,e:"High income/successful business = high ability to take risk; strong preference for safety = low willingness to take risk."},
{id:149,s:"EQUITY",q:"Operationally efficient financial markets are most likely characterized by:",o:["Security prices reflecting fundamental values","Use of resources where most valuable","Liquid markets with low commissions and order price impacts","No bid-ask spreads"],c:2,e:"Operationally efficient markets: liquid markets where costs of arranging trades (commissions, spreads, order price impacts) are low."},
{id:150,s:"EQUITY",q:"Three securities with given prices and shares outstanding. Price-weighted return approximately 18.9%, equal-weighted approximately 18.3%, value-weighted approximately 18.4%. Highest return comes from:",o:["Price weighting","Equal weighting","Value weighting","They are all approximately equal"],c:0,e:"Price-weighted index gives higher weight to higher-priced stocks. In this case, price weighting produces the highest return at approximately 18.9%."},
{id:151,s:"ALT_INV",q:"A clawback provision in PE most likely reflects the right of:",o:["Protecting clients from paying twice for same performance","LPs to reclaim part of GP's performance fee when later losses occur","The minimum return that must be exceeded to earn performance fees","The GP to reclaim management fees if performance is poor"],c:1,e:"Clawback: LPs can reclaim prior incentive fees when GP earns fees on early successful exits but later incurs losses on the fund."},
{id:152,s:"DERIVATIVES",q:"Based on put-call-forward parity, a short forward can be replicated with a:",o:["Short put, long call, and long bond","Short put, short call, and short bond","Long put, short call, and short bond","Long put, long call, and long bond"],c:2,e:"From put-call-forward parity: -F/(1+r)^T = p0 - c0 - X/(1+r)^T — Short forward = long put + short call + short bond (borrowing)."},
{id:153,s:"PORTFOLIO",q:"An investor wanting to avoid polluting companies should specify this in the IPS:",o:["Liquidity section","Unique circumstances section","Investment objectives section","Return requirements section"],c:1,e:"Unique circumstances section covers ESG beliefs, values, and any other material aspects of the client's circumstances likely to affect portfolio composition."},
{id:154,s:"FIXED_INCOME",q:"In bankruptcy under priority of claims, which debt category has lowest loss severity given default?",o:["Second lien debt","Subordinated debt","Senior unsecured debt","Junior subordinated debt"],c:0,e:"Second lien secured debt ranks above both subordinated and senior unsecured debt — has secured interest in pledged assets with second priority."},
{id:155,s:"ALT_INV",q:"Which is most likely a characteristic of real assets?",o:["High liquidity","Homogeneity","Substantial management costs","Low transaction costs"],c:2,e:"Real assets are characterized by illiquidity, heterogeneity, and substantial costs of managing them — all complicating their valuation."},
{id:156,s:"EQUITY",q:"Which index requires the most frequent rebalancing to adjust for price changes?",o:["Price-weighted index","Equal-weighted index","Market-capitalization-weighted index","Float-adjusted market cap index"],c:1,e:"Equal-weighted index requires frequent rebalancing after prices change because any price change breaks equal weighting and must be reset."},
{id:157,s:"DERIVATIVES",q:"If a call option is underpriced, investors can earn excess return by buying the call and simultaneously:",o:["Investing the PV of strike price at risk-free rate","Selling short the underlying and investing proceeds at risk-free rate","Buying the underlying and borrowing at the risk-free rate","Selling a put option with same strike"],c:1,e:"Underpriced call: buy call + short underlying + invest proceeds at risk-free rate generates risk-free cash earning more than the risk-free rate."},
{id:158,s:"DERIVATIVES",q:"The value of a long forward contract at expiration is best defined as:",o:["Forward price minus spot price of underlying","Spot price of underlying minus forward price agreed in contract","Value at initiation minus spot price","Premium paid minus intrinsic value"],c:1,e:"Long forward payoff at expiration = S_T - F_0(T). Positive when spot price exceeds the agreed forward price."},
{id:159,s:"ALT_INV",q:"An investor seeking an indirect debt investment in real estate is most likely to:",o:["Originate a residential mortgage","Purchase a commercial property","Purchase a mortgage-backed security","Buy REIT equity shares"],c:2,e:"MBS are pools of mortgage loans securitized and offered to financial markets — providing indirect (pooled) debt investment in residential property."},
{id:160,s:"ALT_INV",q:"Which method of investing in alternative investments provides the greatest flexibility?",o:["Co-investing","Fund investing","Direct investing","Separate managed account"],c:2,e:"Direct investing provides the greatest flexibility and control — investor can influence management team selection and strategic direction of the asset."},
{id:161,s:"PORTFOLIO",q:"Which behavioral bias most likely helps explain the momentum market anomaly?",o:["Status quo bias","Availability bias","Anchoring and adjustment bias","Loss aversion bias"],c:1,e:"Momentum is partly explained by availability bias — traders reason based on recent experience, forming biased expectations about continuation."},
{id:162,s:"PORTFOLIO",q:"Changes in interest rates due to central bank actions are best classified as:",o:["Total risk","Systematic risk","Diversifiable risk","Idiosyncratic risk"],c:1,e:"Systematic risk is non-diversifiable, inherent in the overall market. Interest rate changes from central banks affect all assets across the market."},
{id:163,s:"DERIVATIVES",q:"The replacement of existing trades on a swap execution facility by the central counterparty is best described as:",o:["Novation","Market making","Marking to market","Settlement"],c:0,e:"Novation: the CCP replaces the initial SEF contract with identical trades, substituting itself as counterparty to both sides of the transaction."},
{id:164,s:"FIXED_INCOME",q:"The point at which bondholder's gain on reinvested coupons equals loss on sale price following interest rate increase is best measured by:",o:["Effective duration","Modified duration","Macaulay duration","Key rate duration"],c:2,e:"Macaulay duration indicates the investment horizon at which coupon reinvestment risk and market price risk exactly offset each other."},
{id:165,s:"FIXED_INCOME",q:"Which duration measure is most appropriate for a callable bond?",o:["Effective duration","Modified duration","Macaulay duration","Dollar duration"],c:0,e:"Effective duration is the appropriate measure for bonds with embedded options; yield duration statistics (modified, Macaulay) require a well-defined YTM."},
{id:166,s:"FIXED_INCOME",q:"The price sensitivity of an option-free bond to a non-parallel shift in the benchmark yield curve is best measured by:",o:["Effective duration","Key rate durations","Modified duration","Dollar duration"],c:1,e:"Key rate (partial) durations measure sensitivity to changes at specific maturity segments — they identify shaping risk from non-parallel yield curve shifts."},
{id:167,s:"FIXED_INCOME",q:"For an option-free bond, a change in spread is most likely to arise from a change in the:",o:["Liquidity of the bond","Expected inflation rate","Expected real rate of interest","Benchmark yield curve slope"],c:0,e:"Spread changes arise from credit risk or liquidity changes. Benchmark yield changes arise from expected inflation or real rate changes."},
{id:168,s:"EQUITY",q:"Compared to market value of equity, book value of equity is most likely:",o:["Measured by net income multiplied by ROE","Influenced more directly by management decisions","Reflective of investors' future cash flow expectations","More forward-looking than market value"],c:1,e:"Management decisions directly influence net income and therefore book value of equity. Market value reflects investors' collective expectations about the future."},
{id:169,s:"FIXED_INCOME",q:"An investment-grade bond index is typically further subdivided by:",o:["Maturity only","Credit rating only","Both maturity and credit rating","Coupon type only"],c:2,e:"Investment-grade indexes are typically subdivided by maturity (short/intermediate/long) and credit rating (e.g., AAA, AA, A, BBB)."},
{id:170,s:"ALT_INV",q:"High-water marks are used by clients in hedge funds to:",o:["Avoid prime brokerage fees","Claw back management fees","Avoid paying twice for the same performance","Reduce the hurdle rate"],c:2,e:"High-water mark: manager must recover all prior losses before earning incentive fees on new profits — protects clients from paying twice for same performance."},
{id:171,s:"FIXED_INCOME",q:"5% semiannual bond settling Feb 5, payments May 31 and Nov 30. Accrued interest (30/360) is closest to:",o:["$9.03","$9.18","$9.31","$8.75"],c:0,e:"From Dec 1 to Feb 5: 2 months and 5 days = 65 days under 30/360. AI = (65/180) x ($50/2) = $9.03 per bond."},
{id:172,s:"FIXED_INCOME",q:"A corporate bond with annual modified duration 7.15 increases in price from 92 to 97 per $100 par. Government yield increases 5 bps. Estimated decline in credit spread is closest to:",o:["71 bps","76 bps","81 bps","65 bps"],c:2,e:"% price change = (97-92)/92 = 5.435%. Delta-Yield = -5.435%/7.15 = -0.0076. Spread decline = 0.0076 + 0.0005 = 0.0081 = 81 bps."},
