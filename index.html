{id:335,s:"ETHICS",q:"Recommended procedures for compliance with Standard I(D) Misconduct include:",o:["Conducting background checks of all employees at least annually","Developing and adopting a code of ethics to which every employee must subscribe","Checking references of potential clients to ensure good character","Implementing zero-tolerance policies for any disciplinary actions"],c:1,e:"Standard I(D): Recommended procedures include developing/adopting a code of ethics to which every employee must subscribe (mandatory, not voluntary)."},
{id:336,s:"ETHICS",q:"Which is a recommended procedure for compliance with Standard III(D) Performance Presentation?",o:["Exclude terminated accounts from performance history","Use a single representative account for each investment mandate","Disclose that investment results are simulated when model results are used","Present only GIPS-compliant composites"],c:2,e:"Standard III(D): Required disclosures include stating when results are simulated, when performance is that of a prior entity, and whether returns are gross or net of fees."},
{id:337,s:"ETHICS",q:"Bernod (former CFA exam writer) states in marketing: 'As someone who helped write CFA exams, I have learned unique insights into portfolio management that will be valuable.' He:",o:["Violated only by expressing negative opinions about CFA Institute policies","Violated only by using his CFA Institute association to further professional goals","Violated both by expressing negative opinions and by using his association to further goals","Did not violate since sharing relevant experience in marketing is acceptable"],c:1,e:"Standard VII(A): Using association with CFA Institute (as exam writer) to imply unique investment insights constitutes improperly using that association for personal goals."},
{id:338,s:"ETHICS",q:"Fischer, CFA, declares personal bankruptcy due to medical bills and is arrested for trespassing during a climate protest (act of civil disobedience). She:",o:["Did not violate any Standards","Violated the Standard relating to misconduct","Violated Standard relating to loyalty, prudence, and care","Violated both misconduct and loyalty"],c:0,e:"Standard I(D): Medical bill bankruptcy and civil disobedience arrests generally do not reflect adversely on professional integrity or competence — not violations."},
{id:339,s:"ETHICS",q:"A member secures a controlling dominant position in an option to benefit from trading the underlying stock. Increased trading leads others to take positions in both the option and underlying stock. The member violated Standards:",o:["By engaging in transaction-based manipulation only","By engaging in information-based manipulation only","By engaging in both transaction-based and information-based manipulation","Only by creating an artificial market signal"],c:0,e:"Standard II(B): Securing a dominant position to exploit and manipulate price of related derivative/underlying is transaction-based manipulation. No false information was spread."},
{id:340,s:"ETHICS",q:"Lorraine changes her stock selection process by adding new factors affecting all clients but notifies them by phone instead of written update. She:",o:["Did not violate — verbal communication is permitted","Violated since adding new factors affects all clients","Violated since she failed to provide written updates","Violated since she should have obtained client consent first"],c:0,e:"Standard V(B): Communication is not confined to written reports. Phone calls, in-person meetings, and electronic communications are all acceptable means."},
{id:341,s:"ETHICS",q:"Jennings overhears the CEO say quarterly report will miss estimates. She calls her brother to tell him and later writes a report using public and nonmaterial nonpublic information to issue a buy recommendation on another company. She violated:",o:["No violations","Only by calling her brother to tell him what she overheard","Only by using nonmaterial nonpublic information in her analysis","Both by calling her brother and using nonmaterial nonpublic information"],c:1,e:"Standard II(A): Information about upcoming quarterly miss is material and nonpublic. Using nonmaterial nonpublic information + public information (mosaic theory) is permitted."},
{id:342,s:"ETHICS",q:"Watt issues buy recommendations for bonds in capsule form and notifies clients that additional information is available upon request. All bonds then decline due to unexpected rate increase. She:",o:["Did not violate any Standards","Violated by issuing recommendations that resulted in large losses","Violated by issuing recommendations without providing further details","Violated by not warning of interest rate risk"],c:0,e:"Standard V(B): Capsule recommendations with availability of more information are acceptable. Unexpected central bank actions cannot be predicted and disclosed."},
{id:343,s:"ETHICS",q:"Vasilis writes in a report 'The company will beat analysts' earnings projections next month.' He then distributes by email to all clients first, then calls each client. He violated Standards:",o:["No violation — he treated all clients fairly","Only by writing the prediction as if it were fact","Only by calling clients after emailing","Both by writing the prediction and by calling clients"],c:1,e:"Standard V(B): Stating 'will beat' earnings projections presents a future opinion as fact — failure to separate fact from opinion."},
{id:344,s:"ETHICS",q:"A member keeps records supporting buy and sell decisions but discards records not leading to position changes and keeps some in hard copy and others in electronic form. She violated Standard relating to record retention:",o:["Only by discarding records not leading to position changes","Only by keeping some records in hard copy and others in electronic form","Both by discarding records and keeping in different formats","Neither — there is no violation"],c:0,e:"Standard V(C): Retention applies to reviews that do NOT lead to position changes too. Mixed hard copy and electronic formats are both acceptable."},
{id:345,s:"ETHICS",q:"A member leaves her employer to start at a new firm. She may recreate supporting records of prior work from:",o:["Memory","Sources obtained at the previous employer","Information provided directly by the covered company","Her personal notes made during employment"],c:2,e:"Standard V(C): Records must be re-created from public sources or directly from the covered company — NOT from memory or sources obtained at the previous employer."},
{id:346,s:"ETHICS",q:"Recommended procedures for compliance with Standard II(A) Material Nonpublic Information include that firms should:",o:["Review employee trading through maintenance of watch lists","Prohibit all proprietary trading when firm has material nonpublic information","Permit regular interdepartmental communication between corporate finance and equity research","Post all material nonpublic information on the firm's intranet for transparency"],c:0,e:"Standard II(A): Watch lists, restricted lists, and rumor lists are minimum elements of an information barrier system. Prohibiting all proprietary trading is generally too broad."},
{id:347,s:"ETHICS",q:"Matthew, CFA, covers several companies, issues buy recommendations with full disclosure of assumptions and methodology. Two weeks later an unexpected event causes significant losses. He:",o:["Did not violate any Standards","Violated Standard relating to diligence and reasonable basis","Violated Standard relating to communication with clients","Violated both diligence and communication Standards"],c:0,e:"Standards V(A) and V(B): Members cannot be expected to disclose risks they are unaware of. An unexpected event after the disclosure does not constitute a violation."},
{id:348,s:"ETHICS",q:"CFA Institute recommends maintaining records for at least how long in the absence of regulatory guidance or firm policies?",o:["Three years","Five years","Seven years","Ten years"],c:2,e:"Standard V(C): CFA Institute recommends maintaining records for at least seven years when no regulatory guidance or firm policies specify otherwise."},
{id:349,s:"ETHICS",q:"A firm's policy requires retaining records for 5 years. No applicable laws exist. A local investment association recommends 8 years. Clients prefer 10 years. Records should be retained for:",o:["5 years","8 years","10 years","7 years (CFA Institute minimum)"],c:0,e:"Standard V(C): The member must follow the firm's policy (5 years). Local industry body recommendations and client preferences are not binding requirements."},
{id:350,s:"ETHICS",q:"Macmara posts: 'CFA exams are outrageously difficult' and 'Thankfully, the CAPM was not tested.' She violated Standards:",o:["Only by writing 'Thankfully, the CAPM was not tested'","Only by writing 'CFA exams are outrageously difficult'","By writing both statements","She did not violate since she expressed personal opinions"],c:0,e:"Standard VII(A): Disclosing what was not tested on the exam is a violation. Expressing opinion about exam difficulty is not covered by the Standard."},
{id:351,s:"ETHICS",q:"Jones manages a client's IPS specifying equal-weighted consumer durables, clean energy, and technology stocks. Technology becomes significantly overweighted due to outperformance. Jones expects it to continue for another year and decides not to rebalance. She violated:",o:["No Standards","Only the Standard relating to suitability","Both suitability and loyalty, prudence, and care","Only loyalty, prudence, and care"],c:2,e:"Standards III(C) and III(A): Ignoring the equal-weight mandate violates suitability; failing to follow client guidelines is a breach of loyalty, prudence, and care."},
{id:352,s:"ETHICS",q:"Which most accurately describes Standards compliance when preparing for new employment?",o:["Members may solicit current clients for the new employer before resigning if the new employer is disclosed","Members may make arrangements on their own time to apply for regulatory licenses for a competing business","Both Statement 1 and Statement 2 are accurate","Neither Statement 1 nor Statement 2 is accurate"],c:1,e:"Standard IV(A): Soliciting current clients before leaving is prohibited. Making arrangements (like regulatory filings) on own time for a competing business is permissible."},
{id:353,s:"ETHICS",q:"A member managing a mutual fund is required under Standard III(C) Suitability to:",o:["Only invest in a manner consistent with the fund's stated mandate","Only determine suitability of the fund for investors purchasing shares","Both invest consistently with the mandate and determine suitability for each investor","Neither — mutual fund managers are exempt from suitability requirements"],c:0,e:"Standard III(C): Managers of pooled funds must invest consistently with the stated mandate. They are not responsible for determining suitability for individual investors purchasing shares."},
{id:354,s:"ETHICS",q:"A member uses a composite to show prospects that the firm has outperformed the benchmark over five years, gross of fees. He states 'Our composite shows we have outperformed.' He:",o:["Did not violate any Standards","Violated misrepresentation by implying future performance","Violated performance presentation by not using net-of-fees returns","Violated by not claiming GIPS compliance"],c:0,e:"Standards I(C) and III(D): Stating a fact about past composite performance is not a guarantee of future returns. No violation here."},
{id:355,s:"ETHICS",q:"Lumunon shows prospects only the best-performing balanced account over 10 years without disclosing it is the best account and that half of similar accounts underperformed. He violated Standards relating to:",o:["Only misrepresentation","Only performance presentation","Both misrepresentation and performance presentation","Neither — showing one account's history is acceptable"],c:2,e:"Standards I(C) and III(D): Selecting only the best-performing account without disclosure misrepresents the firm's track record and violates both standards."},
{id:356,s:"ETHICS",q:"Which is a recommended procedure for compliance with Standard III(A) Loyalty, Prudence, and Care? Members should:",o:["Eliminate all actual and potential conflicts of interest","Make clients aware of all forms of manager compensation","Submit to each client at least annually an itemized statement of funds and securities in custody","Prohibit all soft dollar arrangements"],c:1,e:"Standard III(A): Members should make clients aware of all forms of manager compensation. Quarterly (not annual) itemized statements are recommended. Conflicts must be disclosed, not necessarily eliminated."},
{id:357,s:"ETHICS",q:"Which procedures for Standard III(C) Suitability are both recommended?",o:["Procedure 1 only: annual review of objectives and constraints","Procedure 2 only: consider performance benchmarks in IPS formulation","Both Procedure 1 and Procedure 2","Neither is a recommended procedure"],c:2,e:"Standard III(C): Both annual review of objectives/constraints (more frequent if circumstances change) and including performance benchmarks in the IPS are recommended."},
{id:358,s:"ETHICS",q:"Foster is hired as director of research and discovers the compliance system is inadequate. Her supervisor says improvements will come in four months. Foster should initially:",o:["Resign her new position","Decline in writing to accept supervisory responsibility","Establish departmental procedures herself","Accept the role and improve the system while on the job"],c:1,e:"Standard IV(C): If a member cannot discharge supervisory responsibilities due to inadequate compliance systems, they should decline in writing until the firm adopts reasonable procedures."},
{id:359,s:"ETHICS",q:"According to Standards, a member is required to disclose referral fees of which type under Standard VI(C)?",o:["Soft dollars only","Considerations paid in kind only","Both soft dollars and considerations paid in kind","Only cash payments that exceed a material threshold"],c:2,e:"Standard VI(C): The member must disclose the nature of all consideration including cash payments, soft dollars, and considerations paid in kind."},
{id:360,s:"ETHICS",q:"According to the Standard relating to additional compensation arrangements, a member who is offered additional compensation from a third party for services conflicting with employer's interest:",o:["Is prohibited from accepting the additional compensation in all cases","Is required to notify his employer immediately after receiving it","Must obtain written consent from his employer before accepting the compensation","Must obtain written consent from employer and the third party offering fees before accepting"],c:3,e:"Standard IV(B): Members must obtain written consent from all parties involved before accepting compensation that competes with or might create a conflict with employer's interest."},
];
QS=QS.concat(ETH);
// ── STATE ─────────────────────────────────────────────────────
var ST={
  view:"dashboard",sub:null,answers:{},streak:0,lastStudy:null,
  practiceIds:[],practiceIdx:0,examIds:[],examAns:{},examIdx:0,
  examActive:false,examTime:0,examTimer:null
};
function loadST(){try{var d=JSON.parse(localStorage.getItem("cfa2026")||"{}");if(d.answers)ST.answers=d.answers;if(d.streak)ST.streak=d.streak;if(d.lastStudy)ST.lastStudy=d.lastStudy;}catch(e){}}
function saveST(){try{localStorage.setItem("cfa2026",JSON.stringify({answers:ST.answers,streak:ST.streak,lastStudy:ST.lastStudy}));}catch(e){}}
loadST();

// ── HELPERS ───────────────────────────────────────────────────
function byS(s){return QS.filter(function(q){return q.s===s;})}
function ansS(s){return byS(s).filter(function(q){return ST.answers[q.id]!==undefined;})}
function corS(s){return byS(s).filter(function(q){return ST.answers[q.id]===q.c;})}
function pct(a,b){return b===0?0:Math.round(a/b*100)}
function totAns(){return Object.keys(ST.answers).length}
function totCor(){return QS.filter(function(q){return ST.answers[q.id]===q.c;}).length}
function fmtT(s){var m=Math.floor(s/60),sc=s%60;return(m<10?"0":"")+m+":"+(sc<10?"0":"")+sc}
function shuffle(a){return a.slice().sort(function(){return Math.random()-.5;})}

function toast(msg,type){
  var box=document.getElementById("toast-box");
  var el=document.createElement("div");
  el.className="toast "+(type||"ok");
  el.textContent=msg;
  box.appendChild(el);
  setTimeout(function(){el.remove();},2600);
}

function updateStreak(){
  var today=new Date().toDateString();
  if(ST.lastStudy===today)return;
  var yesterday=new Date(Date.now()-864e5).toDateString();
  ST.streak=(ST.lastStudy===yesterday)?(ST.streak||0)+1:1;
  ST.lastStudy=today;
  document.getElementById("streak-el").textContent="🔥 "+ST.streak+" day streak";
  saveST();
}

// ── ROUTER ────────────────────────────────────────────────────
function go(view,params){
  params=params||{};
  ST.view=view;
  if(params.sub)ST.sub=params.sub;
  document.getElementById("sidebar").classList.remove("open");
  document.querySelectorAll(".nav-item").forEach(function(el){
    el.classList.remove("active");
    if(el.dataset.v===view&&(!el.dataset.s||el.dataset.s===ST.sub))el.classList.add("active");
  });
  var m=document.getElementById("main");
  if(view==="dashboard")m.innerHTML=vDash();
  else if(view==="subjects")m.innerHTML=vSubjects();
  else if(view==="stats")m.innerHTML=vStats();
  else if(view==="concepts")m.innerHTML=vConcepts();
  else if(view==="subject")startPractice(params);
  else if(view==="exam")startExam();
  else if(view==="practice")m.innerHTML=vPractice();
  else if(view==="examView")m.innerHTML=vExam();
  else if(view==="results")m.innerHTML=vResults();
  else m.innerHTML=vDash();
}

// ── DASHBOARD ─────────────────────────────────────────────────
function vDash(){
  var ta=totAns(),tc=totCor();
  var subCovered=Object.keys(SUBS).filter(function(s){return ansS(s).length>0;}).length;
  var weakList=Object.keys(SUBS).map(function(s){return{s:s,p:pct(corS(s).length,Math.max(ansS(s).length,1)),done:ansS(s).length};}).filter(function(x){return x.done>0;}).sort(function(a,b){return a.p-b.p;}).slice(0,3);
  return '<div class="welcome"><h1>Welcome back, Gabriel 👋</h1><p>'+ta+' questions answered &mdash; '+(QS.length-ta)+' remaining across all subjects.</p></div>'+
  '<div class="dash-grid">'+
    '<div class="stat-card"><div class="stat-label">Questions Answered</div><div class="stat-val">'+ta+'</div><div class="stat-sub">of '+QS.length+' total</div></div>'+
    '<div class="stat-card"><div class="stat-label">Overall Accuracy</div><div class="stat-val" style="color:var(--green)">'+(ta>0?pct(tc,ta)+"%":"—")+'</div><div class="stat-sub">'+tc+' correct</div></div>'+
    '<div class="stat-card"><div class="stat-label">Subjects Covered</div><div class="stat-val" style="color:var(--blue)">'+subCovered+'</div><div class="stat-sub">of 10</div></div>'+

      '<div style="margin-top:12px"><button class="btn btn-p" onclick="go(\'exam\')" style="width:100%">📝 Take Mock Exam</button></div>'+
    '</div>'+
  '</div>'+

// ── PRACTICE ──────────────────────────────────────────────────
function startPractice(params){
  ST.sub=params.sub||ST.sub;
  var qs=byS(ST.sub);
  ST.practiceIds=qs.map(function(q){return q.id;});
  ST.practiceIdx=0;
  ST.view="practice";
  document.querySelectorAll(".nav-item").forEach(function(el){el.classList.remove("active");if(el.dataset.v==="subject"&&el.dataset.s===ST.sub)el.classList.add("active");});
  document.getElementById("main").innerHTML=vPractice();
}

function vPractice(){
  var info=SUBS[ST.sub];var ids=ST.practiceIds;
  if(!ids||ids.length===0)return'<div class="q-header"><button class="q-back" onclick="go(\'subjects\')">← Back</button></div><div class="empty"><div class="ei">📭</div>No questions found.</div>';
  var idx=ST.practiceIdx;
  var q=QS.find(function(x){return x.id===ids[idx];});
  var answered=ST.answers[q.id];var shown=answered!==undefined;
  return'<div class="q-header"><button class="q-back" onclick="go(\'subjects\')">← Back</button><span class="q-tag">'+info.icon+' '+info.name+'</span><span class="q-counter">'+(idx+1)+' / '+ids.length+'</span></div>'+
  '<div class="q-box"><div class="q-num">Question '+q.id+'</div><div class="q-text">'+q.q+'</div></div>'+
  '<div class="opts">'+q.o.map(function(opt,i){var cls="opt";if(shown){cls+=" dis";if(i===q.c)cls+=" ok";else if(i===answered&&answered!==q.c)cls+=" bad";}else if(answered===i)cls+=" sel";return'<div class="'+cls+'" onclick="pickOpt('+q.id+','+i+')"><span class="opt-l">'+["A","B","C","D"][i]+'</span><span>'+opt+'</span></div>';}).join('')+'</div>'+
  (shown?'<div class="expl"><strong>💡 Explanation</strong>'+q.e+'</div>':'')+
  '<div class="actions">'+
  (idx>0?'<button class="btn btn-s" onclick="prevQ()">← Prev</button>':'')+
  (!shown?'<button class="btn btn-s" onclick="skipQ()">Skip →</button>':'')+
  (shown&&idx<ids.length-1?'<button class="btn btn-p" onclick="nextQ()">Next →</button>':'')+
  (shown&&idx===ids.length-1?'<button class="btn btn-p" onclick="go(\'subjects\')">Finish ✓</button>':'')+
  '</div>';
}

function pickOpt(qid,oi){
  if(ST.answers[qid]!==undefined)return;
  ST.answers[qid]=oi;saveST();updateStreak();
  var q=QS.find(function(x){return x.id===qid;});
  toast(oi===q.c?"✅ Correct!":"❌ Incorrect — review the explanation",oi===q.c?"ok":"err");
  document.getElementById("main").innerHTML=vPractice();
}
function nextQ(){if(ST.practiceIdx<ST.practiceIds.length-1){ST.practiceIdx++;document.getElementById("main").innerHTML=vPractice();}}
function prevQ(){if(ST.practiceIdx>0){ST.practiceIdx--;document.getElementById("main").innerHTML=vPractice();}}
function skipQ(){if(ST.practiceIdx<ST.practiceIds.length-1){ST.practiceIdx++;document.getElementById("main").innerHTML=vPractice();}}

// ── EXAM ──────────────────────────────────────────────────────
function startExam(){
  if(ST.examActive&&!confirm("Exam in progress. Start a new one?"))return;
  clearInterval(ST.examTimer);
  var pool=[];
  var targets={ETHICS:12,QUANT:8,ECONOMICS:7,FSA:10,CORPORATE:6,EQUITY:6,FIXED_INCOME:5,DERIVATIVES:4,ALT_INV:4,PORTFOLIO:5};
  Object.keys(targets).forEach(function(s){
    var available=shuffle(byS(s));
    pool=pool.concat(available.slice(0,Math.min(targets[s],available.length)));
  });
  pool=shuffle(pool).slice(0,60);
  ST.examIds=pool.map(function(q){return q.id;});
  ST.examAns={};ST.examIdx=0;ST.examActive=true;ST.examTime=3*60*60;
  ST.examTimer=setInterval(function(){
    ST.examTime--;
    var el=document.getElementById("exam-timer");
    if(el){el.textContent=fmtT(ST.examTime);if(ST.examTime<600)el.classList.add("warn");}
    if(ST.examTime<=0){clearInterval(ST.examTimer);submitExam();}
  },1000);
  ST.view="examView";
  document.querySelectorAll(".nav-item").forEach(function(el){el.classList.remove("active");});
  document.getElementById("main").innerHTML=vExam();
}

function vExam(){
  var idx=ST.examIdx;var qid=ST.examIds[idx];var q=QS.find(function(x){return x.id===qid;});
  var doneCount=Object.keys(ST.examAns).length;
  return'<div class="exam-hdr"><div id="exam-timer" class="timer'+(ST.examTime<600?" warn":"")+'">'+fmtT(ST.examTime)+'</div>'+
  '<div class="exam-prog-wrap"><div style="font-size:.72rem;color:var(--txt3)">'+doneCount+' / '+ST.examIds.length+' answered</div><div class="exam-prog"><div class="exam-prog-fill" style="width:'+pct(doneCount,ST.examIds.length)+'%"></div></div></div>'+
  '<button class="btn btn-s" onclick="confirmSubmit()">Submit Exam</button></div>'+
  '<div class="exam-grid">'+ST.examIds.map(function(id,i){var cls="eg-btn";if(ST.examAns[id]!==undefined)cls+=" ans";if(i===idx)cls+=" cur";return'<button class="'+cls+'" onclick="ST.examIdx='+i+';document.getElementById(\'main\').innerHTML=vExam()">'+(i+1)+'</button>';}).join('')+'</div>'+
  '<div class="q-box"><div class="q-num">Question '+(idx+1)+' &middot; '+SUBS[q.s].name+'</div><div class="q-text">'+q.q+'</div></div>'+
  '<div class="opts">'+q.o.map(function(opt,i){var sel=ST.examAns[qid]===i;return'<div class="opt'+(sel?" sel":"")+'" onclick="pickExam('+qid+','+i+')"><span class="opt-l">'+["A","B","C","D"][i]+'</span><span>'+opt+'</span></div>';}).join('')+'</div>'+
  '<div class="actions">'+
  (idx>0?'<button class="btn btn-s" onclick="ST.examIdx='+(idx-1)+';document.getElementById(\'main\').innerHTML=vExam()">← Prev</button>':'')+
  (idx<ST.examIds.length-1?'<button class="btn btn-p" onclick="ST.examIdx='+(idx+1)+';document.getElementById(\'main\').innerHTML=vExam()">Next →</button>':'')+
  '</div>';
}

function pickExam(qid,oi){ST.examAns[qid]=oi;document.getElementById("main").innerHTML=vExam();}

function confirmSubmit(){
  var done=Object.keys(ST.examAns).length,total=ST.examIds.length;
  if(done<total&&!confirm((total-done)+" unanswered questions. Submit anyway?"))return;
  submitExam();
}

function submitExam(){
  clearInterval(ST.examTimer);ST.examActive=false;
  ST.examIds.forEach(function(id){if(ST.examAns[id]!==undefined)ST.answers[id]=ST.examAns[id];});
  saveST();ST.view="results";
  document.getElementById("main").innerHTML=vResults();
}

function vResults(){
  var total=ST.examIds.length;
  if(!total)return'<div class="empty"><div class="ei">📝</div>No exam results yet. Take a mock exam!</div>';
  var correct=ST.examIds.filter(function(id){var q=QS.find(function(x){return x.id===id;});return ST.examAns[id]===q.c;}).length;
  var score=pct(correct,total);var pass=score>=60;
  var bySub={};
  ST.examIds.forEach(function(id){var q=QS.find(function(x){return x.id===id;});if(!bySub[q.s])bySub[q.s]={t:0,c:0};bySub[q.s].t++;if(ST.examAns[id]===q.c)bySub[q.s].c++;});
  return'<div class="res-hero"><div class="res-label">Mock Exam Result</div><div class="res-score '+(pass?"pass":"fail")+'">'+score+'%</div><div class="res-label">'+correct+' / '+total+' correct &nbsp;&middot;&nbsp; '+(pass?"✅ PASS":"⚠️ BELOW THRESHOLD")+'</div><div style="margin-top:12px;font-size:.8rem;color:var(--txt3)">CFA pass threshold approximately 60%</div></div>'+
  '<div class="card" style="margin-bottom:18px"><div class="card-title">Performance by Subject</div>'+
  Object.entries(bySub).map(function(e){var s=e[0],d=e[1];var p=pct(d.c,d.t);var col=p>=70?"var(--green)":p>=50?"var(--gold)":"var(--red)";return'<div class="subj-row"><span class="sr-icon">'+SUBS[s].icon+'</span><span class="sr-name">'+SUBS[s].name+'</span><div class="sr-bar" style="width:120px"><div class="sr-fill" style="width:'+p+'%;background:'+col+'"></div></div><span class="sr-pct" style="color:'+col+'">'+p+'%</span></div>';}).join('')+'</div>'+
  '<div class="actions"><button class="btn btn-p" onclick="go(\'exam\')">📝 Retake Exam</button><button class="btn btn-s" onclick="go(\'dashboard\')">← Dashboard</button></div>';
}

// ── CONCEPTS PAGE ─────────────────────────────────────────────
var CONCEPTS=[
{id:"options",title:"📈 Options: Calls, Puts & Parity",body:'<strong>Call Option</strong>: Right (not obligation) to BUY the underlying at strike price K. <br>Intrinsic value at expiration = max(S − K, 0).<br>In-the-money (ITM): S > K &nbsp;|&nbsp; At-the-money (ATM): S = K &nbsp;|&nbsp; Out-of-the-money (OTM): S < K.<br><br><strong>Put Option</strong>: Right (not obligation) to SELL the underlying at strike price K.<br>Intrinsic value at expiration = max(K − S, 0).<br>In-the-money (ITM): K > S &nbsp;|&nbsp; Out-of-the-money (OTM): K < S.<br><br><strong>Key drivers of option value:</strong><table><tr><th>Factor</th><th>Call Value</th><th>Put Value</th></tr><tr><td>↑ Underlying price (S)</td><td>+</td><td>−</td></tr><tr><td>↑ Strike price (K)</td><td>−</td><td>+</td></tr><tr><td>↑ Time to expiration</td><td>+</td><td>+</td></tr><tr><td>↑ Volatility (σ)</td><td>+</td><td>+</td></tr><tr><td>↑ Risk-free rate (r)</td><td>+</td><td>−</td></tr><tr><td>↑ Dividends</td><td>−</td><td>+</td></tr></table><div class="formula">Put-Call Parity: C − P = S₀ − PV(K) &nbsp;&nbsp;&nbsp; or &nbsp;&nbsp;&nbsp; C + PV(K) = P + S₀<br>Fiduciary call = Protective put</div><div class="example"><strong>Example: Synthetic Long Forward</strong>Long call + Short put (same strike) = Long forward. If you buy a call at strike 100 and sell a put at strike 100, your payoff = S − 100 at expiration. Exactly like owning a forward contract.</div><div class="tip">Higher interest rates increase call values and decrease put values because they reduce the present value of the strike price (what you pay on exercise for calls, what you receive on exercise for puts).</div>'},
{id:"duration",title:"🏦 Duration & Convexity",body:'<strong>Macaulay Duration</strong>: Weighted average time to receive cash flows. Also the investment horizon at which reinvestment risk and price risk offset each other.<br><br><strong>Modified Duration</strong>: Measures percentage price change for a 1% change in yield.<div class="formula">% ΔPrice ≈ −Modified Duration × ΔYield</div><strong>Rules of thumb:</strong><ul style="margin-left:18px;margin-top:6px"><li>Higher coupon → shorter duration (more cash flows earlier)</li><li>Longer maturity → longer duration</li><li>Zero-coupon bond: Duration = Maturity (highest possible duration for a given maturity)</li><li>Callable bonds: Use Effective Duration (not Modified) — embedded options prevent a well-defined YTM</li></ul><br><strong>Key Rate Duration</strong>: Sensitivity to a change at a specific maturity point on the yield curve. Identifies shaping risk (non-parallel shifts).<br><br><strong>Convexity</strong>: The curvature of the price-yield relationship. Positive convexity means price rises MORE than duration predicts when yields fall, and falls LESS when yields rise.<div class="formula">% ΔPrice ≈ (−ModDur × ΔYield) + (½ × Convexity × ΔYield²)</div><div class="example"><strong>Example: Duration + Convexity</strong>Bond: Modified Duration = 5, Convexity = 30, Yield decreases by 1% (−0.01).<br>% ΔPrice ≈ (−5 × −0.01) + (0.5 × 30 × 0.0001) = 5.00% + 0.15% = 5.15%<br>Without convexity: price rises 5.00%. With convexity: rises 5.15% — more favorable.</div><div class="tip">Callable bonds exhibit negative convexity when yields are low (call option likely to be exercised). When yields are high, the call is less valuable and the bond behaves like a straight bond with positive convexity.</div>'},
{id:"hedgefees",title:"💎 Hedge Fund Fees & HWM",body:'<strong>Standard "2 and 20" Fee Structure:</strong><ul style="margin-left:18px;margin-top:6px"><li><strong>Management fee</strong>: 2% of AUM (usually calculated on year-end or beginning AUM)</li><li><strong>Incentive fee</strong>: 20% of profits above any hurdle rate</li></ul><br><strong>Hurdle Rate Types:</strong><div class="example"><strong>Hard Hurdle Rate</strong>: Incentive fee paid only on returns IN EXCESS of the hurdle rate (e.g., 8%).</div><div class="example"><strong>Soft Hurdle Rate</strong>: If returns exceed the hurdle, incentive fee is paid on the ENTIRE return.</div><br><strong>High-Water Mark (HWM)</strong>: Highest net-of-fee value ever achieved. Manager must recover all prior losses before earning incentive fees on new profits. Prevents investors from paying twice for the same performance.<div class="formula">Total Fees = Management Fee + Incentive Fee<br>Incentive Fee (soft hurdle) = Rate × Gross Return × AUM (if return > hurdle)<br>Incentive Fee (hard hurdle) = Rate × (Return − Hurdle Rate) × AUM</div><div class="example"><strong>Example:</strong> Fund: $100M AUM, 2/20, soft hurdle 5%, gross return 12%.<br>Management fee: $100M × 2% = $2M<br>Incentive fee: $100M × 12% × 20% = $2.4M (soft hurdle — paid on entire return since 12% > 5%)<br>Total fees: $4.4M &nbsp;|&nbsp; Net return: (12M − 4.4M)/100M = 7.6%</div><div class="tip">For the waterfall question: Whole-of-fund waterfall is less advantageous to GPs — all distributions go to LPs first until they recover initial investment plus hurdle. Deal-by-deal allows GPs to earn incentive fees on early winning exits even if later deals lose money.</div>'},
{id:"eps",title:"📊 EPS & Diluted EPS",body:'<strong>Basic EPS:</strong><div class="formula">Basic EPS = (Net Income − Preferred Dividends) / Weighted Average Common Shares Outstanding</div><strong>Weighted Average Shares:</strong> Account for new issuances (weight by months outstanding), stock splits, and stock dividends (retroactively applied to BEGINNING of period).<div class="example"><strong>Example:</strong> 1 Jan: 1,000,000 shares. 1 July: 2-for-1 stock split.<br>Adjusted shares (retroactive) = 2,000,000 for entire year.<br>If net income = $3.1M, preferred dividends = $500K:<br>Basic EPS = (3.1M − 0.5M) / 2,000,000 = $1.30</div><br><strong>Diluted EPS:</strong> Assumes all dilutive securities are converted/exercised (options, warrants, convertible bonds, convertible preferred). Uses the TREASURY STOCK METHOD for options/warrants.<div class="formula">Diluted EPS = (Net Income − Preferred Div + Savings from converted debt after tax) / (Diluted shares)</div><strong>Treasury Stock Method (options/warrants):</strong><br>Net new shares = Options exercised − Shares repurchased with proceeds<br>If proceeds (options × strike) can buy fewer shares than exercised → dilutive<div class="example"><strong>Example: Options</strong> 100,000 options at $30 strike. Stock price $50.<br>If exercised: issue 100,000 new shares. Proceeds = $3M → buy back 3M/50 = 60,000 shares.<br>Net dilutive shares = 100,000 − 60,000 = 40,000 additional shares.</div><div class="tip">Stock splits and stock dividends are applied retroactively to the BEGINNING of the period (or date of issuance if during the year, adjusted back). Cash dividends are NOT applied retroactively — they reduce net income available to common shareholders.</div>'},
{id:"regression",title:"📐 Linear Regression Essentials",body:'<strong>Simple Linear Regression:</strong><div class="formula">Y = b₀ + b₁X + ε<br>b₁ (slope) = Cov(X,Y) / Var(X) = correlation × (σ_Y / σ_X)<br>b₀ (intercept) = Ȳ − b₁X̄</div><strong>Key Statistics:</strong><table><tr><th>Statistic</th><th>Meaning</th></tr><tr><td>R² (coefficient of determination)</td><td>% of variation in Y explained by X</td></tr><tr><td>Standard Error of Estimate (SEE)</td><td>Average error of regression line</td></tr><tr><td>F-statistic</td><td>Tests overall significance of model</td></tr><tr><td>t-statistic for slope</td><td>b₁ / s(b₁) — tests if slope ≠ 0</td></tr></table><br><strong>Standard Error of Slope:</strong><div class="formula">s(b₁) = SEE / √[Σ(Xᵢ − X̄)²] = SEE / √(Variation of X)</div><strong>Functional Forms:</strong><table><tr><th>Model</th><th>Form</th><th>Interpretation of Slope</th></tr><tr><td>Lin-Lin</td><td>Y = b₀ + b₁X</td><td>Absolute change in Y per absolute change in X</td></tr><tr><td>Log-Lin</td><td>ln(Y) = b₀ + b₁X</td><td>Relative change in Y per absolute change in X</td></tr><tr><td>Lin-Log</td><td>Y = b₀ + b₁ln(X)</td><td>Absolute change in Y per relative change in X</td></tr><tr><td>Log-Log</td><td>ln(Y) = b₀ + b₁ln(X)</td><td>Relative change in Y per relative change in X (elasticity!)</td></tr></table><div class="example"><strong>Multicollinearity</strong>: When independent variables are highly correlated with each other. Result: coefficients are unbiased but standard errors are INFLATED → t-statistics are too small → may fail to reject H₀ when you should. Detected by high R² but insignificant individual t-statistics.</div><div class="tip">The log-log model (double-log) is used to calculate elasticities because the slope coefficient equals the relative change in Y for a relative change in X. This is key for price elasticity of demand calculations.</div>'},
{id:"indexes",title:"📊 Index Weighting Methods",body:'<strong>Price-Weighted Index:</strong> Weight = Price of each security. Higher-priced stocks dominate. Affected by stock splits (divisor adjusts).<div class="formula">Index Return = (Sum of end prices / Sum of beginning prices) − 1<br>Example: DJIA</div><div class="example"><strong>Price-weighted example:</strong> Three stocks at $50, $75, $60. Returns: 20%, 26.7%, 8.3%.<br>Price-weighted return = (60+95+65)/(50+75+60) − 1 = 220/185 − 1 = 18.9%</div><br><strong>Equal-Weighted Index:</strong> Same weight for each security regardless of price or market cap. Requires most frequent rebalancing (any price change breaks equal weighting).<div class="formula">Index Return = Simple average of individual returns</div><div class="example"><strong>Equal-weighted:</strong> (20% + 26.7% + 8.3%) / 3 = 18.3%</div><br><strong>Value-Weighted (Market Cap) Index:</strong> Weight = Market cap / Total market cap. Automatically adjusts with price changes — minimal rebalancing needed. Example: S&P 500.<div class="formula">Index Return = (End market cap / Beginning market cap) − 1<br>Must adjust for new issuances, buybacks between periods</div><div class="example"><strong>Value-weighted:</strong> Start MV = 300×50 + 350×75 + 400×60 = 65,250. End MV = 300×60 + 350×95 + 400×65 = 77,250.<br>Return = 77,250/65,250 − 1 = 18.4%</div><br><strong>Float-Adjusted Market Cap:</strong> Only counts shares available to the public (excludes insider holdings). Used by most major modern indices.<div class="tip">Price-weighted: stock splits reduce the weight of high-priced stocks (divisor adjusts). Value-weighted: automatically self-rebalances as prices change. Equal-weighted: requires constant rebalancing and naturally overweights small-cap stocks relative to the market.</div>'},
{id:"wacc",title:"🏢 WACC & Capital Structure",body:'<strong>Weighted Average Cost of Capital (WACC):</strong><div class="formula">WACC = w_d × r_d × (1 − t) + w_p × r_p + w_e × r_e<br><br>Where: w = target weight, r = cost of capital, t = marginal tax rate<br>Note: Only debt gets the (1-t) tax shield</div><div class="example"><strong>Example:</strong> D/E = 0.5 → D/(D+E) = 1/3, E/(D+E) = 2/3<br>Cost of equity = 12%, Cost of debt = 6%, Tax = 30%<br>WACC = (1/3)(6%)(1-0.30) + (2/3)(12%) = 1.40% + 8.00% = 9.40%</div><br><strong>MM Without Taxes:</strong> Firm value is independent of capital structure. As D/E increases, cost of equity increases to keep WACC constant. Tax shield does not exist.<br><br><strong>MM With Taxes:</strong> Firm value increases with debt (PV of tax shield = t × D). Optimal = 100% debt (without considering distress costs).<br><br><strong>Trade-off Theory:</strong> Optimal capital structure balances tax shield benefits against financial distress costs.<br><br><strong>Pecking Order Theory:</strong> Internal funds → Debt → Equity (last resort due to information asymmetry).<div class="formula">IRR Rule: Accept project if IRR > WACC (hurdle rate)<br>NPV Rule: Accept if NPV > 0 (use required rate of return = WACC)</div><div class="tip">For mutually exclusive projects, ALWAYS use NPV — not IRR. IRR can give conflicting rankings and multiple IRRs when cash flow signs change more than once. IRR also assumes reinvestment at the IRR itself (often unrealistic); NPV assumes reinvestment at WACC.</div>'},
{id:"fixed",title:"🏦 Fixed Income: YTM, Spreads & More",body:'<strong>Yield-to-Maturity (YTM):</strong> The internal rate of return on a bond assuming: (1) held to maturity, (2) all coupons reinvested at the YTM. This reinvestment assumption is the key limitation.<br><br><strong>Spot Rate vs. Forward Rate:</strong><div class="formula">Spot rate: Zero-coupon yield for a specific maturity<br>Forward rate f(j,k): Rate from year j to year j+k<br>(1 + S_j)^j × (1 + f(j,k))^k = (1 + S_{j+k})^{j+k}</div><br><strong>Yield Spreads:</strong><table><tr><th>Spread</th><th>Benchmark</th><th>Captures</th></tr><tr><td>Nominal spread</td><td>Single benchmark YTM</td><td>All risks vs. benchmark</td></tr><tr><td>Z-spread</td><td>Spot rate curve</td><td>All risks vs. curve</td></tr><tr><td>OAS</td><td>Spot rate curve</td><td>All risks EXCEPT option cost</td></tr></table><div class="formula">OAS = Z-spread − Option Value<br>Callable bond: OAS < Z-spread (call option benefits issuer)<br>Putable bond: OAS > Z-spread (put option benefits investor)</div><br><strong>Bootstrapping:</strong> Derives zero-coupon (spot) rates sequentially from coupon bond prices starting from shortest maturity.<div class="example"><strong>Accrued Interest (30/360):</strong> From Nov 30 to Feb 5 = 2 months 5 days = 65 days (30/360 convention). AI = (65/180) × (Coupon/2). For a 5% bond with $1000 par: AI = (65/180) × $25 = $9.03.</div><div class="tip">OAS is the most important spread measure because it removes the impact of embedded options, enabling fair comparison across bonds with different option structures. A higher OAS generally means more credit/liquidity risk compensation.</div>'},
{id:"equity",title:"📈 Equity Valuation Methods",body:'<strong>Gordon Growth Model (GGM):</strong><div class="formula">V₀ = D₁ / (r − g) = D₀ × (1 + g) / (r − g)</div><strong>Justified P/E:</strong><div class="formula">P/E = Payout Ratio / (r − g) = (1 − b) / (r − g)<br>where b = retention rate, r = required return, g = sustainable growth rate</div><br><strong>Residual Income Model:</strong> Book value today + PV of all future residual income.<div class="formula">RI_t = EPS_t − r × BV_{t-1}<br>V₀ = BV₀ + PV(future RI)</div><strong>Free Cash Flow to Equity (FCFE):</strong><div class="formula">FCFE = Net Income + Depreciation − CapEx − ΔWorking Capital + Net Borrowing</div><strong>Free Cash Flow to the Firm (FCFF):</strong><div class="formula">FCFF = Net Income + Depreciation + Interest × (1-t) − CapEx − ΔWorking Capital<br>FCFE = FCFF − Interest × (1-t) + Net Borrowing</div><br><strong>Price Multiples:</strong><table><tr><th>Multiple</th><th>Best For</th><th>Weakness</th></tr><tr><td>P/E</td><td>Profitable mature companies</td><td>Negative earnings, distorted by accounting</td></tr><tr><td>P/B</td><td>Banks, financials, asset-heavy</td><td>Intangible-heavy service companies</td></tr><tr><td>P/S</td><td>Negative earnings firms, cyclicals</td><td>Ignores profitability differences</td></tr><tr><td>EV/EBITDA</td><td>Capital-intensive, M&A analysis</td><td>Ignores capex requirements</td></tr></table><div class="tip">EV/EBITDA is particularly useful for comparing companies with different capital structures because enterprise value captures total firm value and EBITDA is pre-financing — making comparisons across differently-leveraged companies apples-to-apples.</div>'},
{id:"portfolio",title:"🎯 Portfolio Theory & Risk Measures",body:'<strong>Modern Portfolio Theory:</strong><div class="formula">Portfolio return: E(Rp) = Σ wᵢ × E(Rᵢ)<br>Portfolio variance (2 assets): σ²p = w₁²σ₁² + w₂²σ₂² + 2w₁w₂Cov(R₁,R₂)<br>Covariance = ρ₁₂ × σ₁ × σ₂</div><div class="example"><strong>Key insight:</strong> If ρ < 1, portfolio σ < weighted average of individual σ values — diversification benefit.<br>If ρ = +1: no benefit. If ρ = −1: can eliminate all risk.</div><br><strong>CAPM:</strong><div class="formula">E(Rᵢ) = Rf + βᵢ × [E(Rm) − Rf]<br>Beta = Cov(Rᵢ,Rm) / σ²m = ρ × σᵢ / σm</div><br><strong>Performance Measures:</strong><table><tr><th>Measure</th><th>Formula</th><th>Risk Used</th></tr><tr><td>Sharpe Ratio</td><td>(Rp − Rf) / σp</td><td>Total risk (σ)</td></tr><tr><td>Treynor Ratio</td><td>(Rp − Rf) / βp</td><td>Systematic risk (β)</td></tr><tr><td>Jensen Alpha</td><td>Rp − [Rf + β(Rm − Rf)]</td><td>CAPM benchmark</td></tr><tr><td>M-squared</td><td>Sharpe × σm + Rf</td><td>Total risk adjusted</td></tr></table><br><strong>CML vs. SML:</strong><br>• CML: uses total risk (σ), applies only to efficient portfolios<br>• SML: uses systematic risk (β), applies to any individual security or portfolio<div class="formula">Capital Market Line: E(Rp) = Rf + [(E(Rm) − Rf) / σm] × σp<br>Security Market Line: E(Ri) = Rf + βᵢ × [E(Rm) − Rf]</div><div class="tip">Use Sharpe ratio to compare TOTAL portfolios (where total risk matters). Use Treynor ratio when comparing ONE portfolio&#39;s contribution to a well-diversified fund (systematic risk is what matters). Use Jensen&#39;s alpha for absolute outperformance vs. CAPM prediction.</div>'},
{id:"ethics_key",title:"⚖️ Ethics: Key Standards Summary",body:'<table><tr><th>Standard</th><th>Key Rule</th></tr><tr><td>I(A) Knowledge of Law</td><td>Follow the MORE STRICT of local law or CFA Standards</td></tr><tr><td>I(B) Independence</td><td>Decline gifts that could impair objectivity; pay own travel</td></tr><tr><td>I(C) Misrepresentation</td><td>No false statements, no plagiarism, no performance guarantees</td></tr><tr><td>I(D) Misconduct</td><td>No fraud or deceit; bankruptcy alone (without fraud) is not a violation</td></tr><tr><td>II(A) Material Nonpublic Info</td><td>Do not trade or cause others to trade on MNP info; mosaic theory permits MPI + nonmaterial NPI</td></tr><tr><td>II(B) Market Manipulation</td><td>No artificial price/volume distortion; intent matters; legitimate strategies are OK</td></tr><tr><td>III(A) Loyalty, Prudence, Care</td><td>Client interests first; brokerage is a client asset; soft dollars must benefit clients</td></tr><tr><td>III(B) Fair Dealing</td><td>Fair and impartial (not equal); minimize time between decision and dissemination</td></tr><tr><td>III(C) Suitability</td><td>Know your client (IPS); evaluate in context of total portfolio; mutual fund managers follow the mandate</td></tr><tr><td>III(D) Performance Presentation</td><td>Fair, accurate, complete; use composites not single accounts; disclose simulation</td></tr><tr><td>III(E) Confidentiality</td><td>Protect client info even after relationship ends; disclose only if required by law or client permission</td></tr><tr><td>IV(A) Loyalty to Employer</td><td>Cannot solicit clients before leaving; can make arrangement preparations on own time</td></tr><tr><td>IV(B) Additional Compensation</td><td>Get written consent from employer BEFORE accepting additional comp (clients or third parties)</td></tr><tr><td>IV(C) Supervisors</td><td>Establish reasonable procedures; decline supervisory role in writing if system is inadequate</td></tr><tr><td>V(A) Diligence and Reasonable Basis</td><td>Adequate research; can rely on third-party research with reasonable vetting</td></tr><tr><td>V(B) Communication with Clients</td><td>Separate fact from opinion; disclose limitations and risks; communication can be verbal or written</td></tr><tr><td>V(C) Record Retention</td><td>7 years minimum (CFA recommendation); firm records stay with firm; recreate from public sources only</td></tr><tr><td>VI(A) Avoid/Disclose Conflicts</td><td>Full disclosure to clients and employer of all conflicts</td></tr><tr><td>VI(B) Priority of Transactions</td><td>Client transactions first; employer second; personal trades last</td></tr><tr><td>VI(C) Referral Fees</td><td>Disclose ALL forms (cash, soft dollars, in-kind) BEFORE entering formal engagement</td></tr><tr><td>VII(A) CFA Program Conduct</td><td>Do not disclose exam content (including topics NOT tested); opinions about CFA Institute are OK</td></tr><tr><td>VII(B) CFA Designation</td><td>Do not imply superior performance; no partial designations (no "CFA Level II"); no lowercase</td></tr></table><div class="tip">The most commonly tested distinction: A member who disagrees with a team recommendation does NOT need to disassociate unless the process was flawed. If the process was sound, leaving your name on the report is acceptable (disassociation is optional, not required).</div>'},
];

var activeConceptId=null;
function vConcepts(){
  return'<div class="section-title">🧠 Concept Guide</div>'+
  '<p style="font-size:.83rem;color:var(--txt2);margin-bottom:16px">Detailed explanations with formulas and examples for the most challenging CFA Level I topics.</p>'+
  '<div class="concept-nav">'+CONCEPTS.map(function(c){return'<button class="cnav-btn'+(activeConceptId===c.id?" on":"")+'\" onclick="toggleConcept(\''+c.id+'\')">'+c.title+'</button>';}).join('')+'</div>'+
  '<div id="concepts-body">'+
  (activeConceptId?CONCEPTS.filter(function(c){return c.id===activeConceptId;}).map(renderConcept).join(''):CONCEPTS.map(renderConcept).join(''))+
  '</div>';
}
function renderConcept(c){return'<div class="concept-card"><div class="concept-title">'+c.title+'</div><div class="concept-body">'+c.body+'</div></div>';}
function toggleConcept(id){activeConceptId=(activeConceptId===id)?null:id;document.getElementById("main").innerHTML=vConcepts();}

});
